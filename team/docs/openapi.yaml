          description: serviceKind filter
        - name: category
          in: query
          schema:
            type: string
          description: FINANCING/ACCREDITATION category filter
        - name: city
          in: query
          schema:
            type: string
          description: coverage region filter (DP-16, normalized match)
        - name: q
          in: query
          schema:
            type: string
          description: free-text search on name/summary/description/institution (alias - search)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 60
      responses:
        '200':
          description: Public service directory page
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancierService'
