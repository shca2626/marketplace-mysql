                  page:
                    type: integer
                  limit:
                    type: integer
        '403':
          description: Your account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Public service detail (terms + requirements preview)
      tags: [Financing]
      security: []
      description: >
        Public service detail: terms + text attributes + coverage. The
        composed requirements are LABELS ONLY (requirementsPreview) for
        anonymous viewers; signed-in viewers additionally get the FULL typed
        requirements (ServiceRequirementDTO incl. template options, bounds,
        documentType) the apply wizard renders its typed inputs from - the
        real checklist is generated per request at submit. Increments
        viewCount.
      responses:
        '200':
          description: Service detail with requirements preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    $ref: '#/components/schemas/FinancierService'
                  requirements:
                    type: array
                    description: signed-in viewers only - full typed definitions
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ServiceRequirement'
                        - type: object
                          properties:
                            template:
                              $ref: '#/components/schemas/ConditionTemplate'
                  requirementsPreview:
                    type: array
                    description: labels-only checklist (all viewers)
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        isRequired:
                          type: boolean
                        title:
                          type: string
                        conditionType:
                          type: string
                          enum: [DOCUMENT, PROFILE_FIELD, DECLARATION, TEXT, NUMBER, DATE, SELECT, MULTI_SELECT]
                        instructions:
                          type: [string, 'null']
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This service is not accepting applications (not ACTIVE / suspended institution)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/requests:
    get:
      summary: List my financing requests + multiGroupId sibling groups
      tags: [Financing]
      security:
        - cookieAuth: []
      description: >
        Applicant view: own requests (created by the caller or via
        organization membership), plus groups of rows sharing a multiGroupId
        for the side-by-side sibling comparison view (DP-25). Each summary
        carries the latest SENT offer (bestOffer) and offer count. Runs the
        lazy expiry sweep.
      responses:
        '200':
          description: Financing request list + sibling groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancingRequest'
                  groups:
                    type: array
                    description: multiGroupId buckets for sibling comparison (DP-25)
                    items:
                      type: object
                      properties:
                        multiGroupId:
                          type: string
                        requests:
                          type: array
                          items:
                            $ref: '#/components/schemas/FinancingRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load your requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a financing application (single or multi-financier)
      tags: [Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: financing:create-request (20 per 10 minutes)
      description: >
        Creates DRAFT FinancingRequest(s) from the wizard payload. Single
        financier: {serviceId}. Multi-financier (DP-25): {serviceIds: [...]}
        (2-8, one service per financier) mints N sibling DRAFTs sharing a
        multiGroupId, each with its own checklist. submit:true submits every
        created request in the same call (checklist generation, consent
        stamp, expiry - see POST /api/financing/requests/{id}/submit). The
        ask must fall inside the service's amount range.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceId:
                  type: string
                  description: the applied-for FinancierService (serviceKind FINANCING enforced)
                serviceIds:
                  type: array
                  minItems: 2
                  maxItems: 8
                  items:
                    type: string
                  description: multi-financier mode - one service per financier (DP-25)
                organizationId:
                  type: [string, 'null']
                  description: applicant org context; absent = individual (DP-13)
                targetType:
                  type: string
                  maxLength: 16
                targetId:
                  type: [string, 'null']
                activityStatus:
                  type: [string, 'null']
                  enum: [NEW, EXISTING]
                activityName:
                  type: [string, 'null']
                  maxLength: 160
                activityDescription:
                  type: [string, 'null']
                  maxLength: 4000
                activityStartDate:
                  type: [string, 'null']
                activityCity:
                  type: [string, 'null']
                  maxLength: 120
                  description: matched against service coverage (DP-16)
                activityDistrict:
                  type: [string, 'null']
                  maxLength: 120
                activityAddress:
                  type: [string, 'null']
                  maxLength: 255
                activityLocationType:
                  type: [string, 'null']
                  enum: [OWNED, RENTED]
                activityCategory:
                  type: [string, 'null']
                  maxLength: 24
                activityCategoryOther:
                  type: [string, 'null']
                  maxLength: 160
                capitalAmount:
                  type: [number, 'null']
                  minimum: 0
                ownContributionAmount:
                  type: [number, 'null']
                  minimum: 0
                monthlyInstallmentCapacity:
                  type: [number, 'null']
                  minimum: 0
                previousFinancing:
                  type: [boolean, 'null']
                otherIncomeSources:
                  type: [string, 'null']
                  maxLength: 500
                amountRequested:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000000
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                purpose:
                  type: [string, 'null']
                  maxLength: 4000
                tenorRequestedMonths:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 120
                guaranteeType:
                  type: [string, 'null']
                  maxLength: 24
                guaranteeTypeOther:
                  type: [string, 'null']
                  maxLength: 160
                guaranteeStatus:
                  type: [string, 'null']
                  maxLength: 24
                guaranteeStatusOther:
                  type: [string, 'null']
                  maxLength: 160
                applicantNotes:
                  type: [string, 'null']
                  maxLength: 4000
                submit:
                  type: boolean
                  description: when true, each created request is submitted immediately
                consent:
                  type: boolean
                  description: data-transfer consent; stamps consentAt at submit
                answers:
                  type: array
                  maxItems: 60
                  description: checklist answers (requirementId or conditionTemplateId + typed value)
                  items:
                    type: object
                    properties:
                      requirementId:
                        type: string
                      conditionTemplateId:
                        type: string
                      valueText:
                        type: [string, 'null']
                        maxLength: 500
                      valueNumber:
                        type: [number, 'null']
                      valueDate:
                        type: [string, 'null']
                      accountDocumentId:
                        type: [string, 'null']
                        description: reuse of a vault document (uploaded once - R-2)
                      confirmed:
                        type: boolean
                        description: DECLARATION checkbox
      responses:
        '201':
          description: >
            Created request(s); submitted present when submit:true (per-request
            detail after the submit step)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancingRequest'
                  submitted:
                    type: array
                    description: only when submit:true - the submitted request details
                    items:
                      $ref: '#/components/schemas/FinancingRequest'
        '400':
          description: Invalid application payload / no service picked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of the applicant organization / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Service not ACTIVE / amount outside the service range / duplicate financier in a multi group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to create the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Request detail (checklist verdicts + gate status + offers)
      tags: [Financing]
      security:
        - cookieAuth: []
      description: >
        Applicant (creator, org member, or admin) view of one request: the
        wizard payload summary, the gate's per-requirement verdicts
        (RequirementSubmission rows with nested requirement/template labels),
        a gate completeness object, and the visible offers (never DRAFT).
        Runs the lazy expiry sweep.
      responses:
        '200':
          description: Request detail with checklist, gate status and offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    allOf:
                      - $ref: '#/components/schemas/FinancingRequest'
                      - type: object
                        properties:
                          submissions:
                            type: array
                            items:
                              $ref: '#/components/schemas/RequirementSubmission'
                          gate:
                            type: object
                            description: checklist completeness meter
                            properties:
                              totalRequired:
                                type: integer
                              verified:
                                type: integer
                              waived:
                                type: integer
                              canForward:
                                type: boolean
                              missing:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    submissionId:
                                      type: string
                                    title:
                                      type: string
                                    status:
                                      type: string
                          offers:
                            type: array
                            description: visible offers only (never DRAFT)
                            items:
                              $ref: '#/components/schemas/FinancingOffer'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied (not a party to this request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/requests/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Submit the request into the platform gate (DRAFT → SUBMITTED)
      tags: [Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: financing:submit (30 per 10 minutes)
      description: >
        DRAFT → SUBMITTED. Generates the per-service checklist (one
        RequirementSubmission per active requirement incl. PROFILE_FIELD
        auto-evals and wizard answers), stamps consentAt when consent is
        given, sets expiresAt (financingGeneral.requestExpiryDays, default
        30) and enters the platform gate queue. The ask is re-validated
        against the service's current range. Consent is required when
        financingIntake.requireConsent is on.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                consent:
                  type: boolean
                answers:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    properties:
                      requirementId:
                        type: string
                      conditionTemplateId:
                        type: string
                      valueText:
                        type: [string, 'null']
                        maxLength: 500
                      valueNumber:
                        type: [number, 'null']
                      valueDate:
                        type: [string, 'null']
                      accountDocumentId:
                        type: [string, 'null']
                      confirmed:
                        type: boolean
      responses:
        '200':
          description: Submitted request detail (with the generated checklist)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/FinancingRequest'
        '400':
          description: Consent required / invalid answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financing applications disabled by the platform / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot submit a request that is not DRAFT / service not accepting applications / ask outside range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to submit the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/requests/{id}/resubmit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Resubmit after return (RETURNED_FOR_COMPLETION → UNDER_PLATFORM_REVIEW)
      tags: [Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: financing:resubmit (30 per 10 minutes)
      description: >
        Re-supplies the flagged items (REJECTED → SUBMITTED; previously
        VERIFIED/WAIVED items are preserved) and moves the request back to
        UNDER_PLATFORM_REVIEW.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    properties:
                      requirementId:
                        type: string
                      conditionTemplateId:
                        type: string
                      valueText:
                        type: [string, 'null']
                        maxLength: 500
                      valueNumber:
                        type: [number, 'null']
                      valueDate:
                        type: [string, 'null']
                      accountDocumentId:
                        type: [string, 'null']
                      confirmed:
                        type: boolean
      responses:
        '200':
          description: Resubmitted request detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/FinancingRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot resubmit a request that is not RETURNED_FOR_COMPLETION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to resubmit the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/requests/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
