  /api/products/bulk:
    post:
      summary: Bulk operations for sellers (import / status / price / delete)
      tags: [Products]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: productWrite (60 per 10 min per user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, rows]
                  properties:
                    action:
                      type: string
                      enum: [import]
                    rows:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items:
                        type: object
                        additionalProperties: true
                      description: CSV/JSON import rows mapped onto the product form
                - type: object
                  required: [action, ids, status]
                  properties:
                    action:
                      type: string
                      enum: [status]
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 500
                      items:
                        type: string
                    status:
                      type: string
                      enum: [ACTIVE, DRAFT, ARCHIVED]
                - type: object
                  required: [action, ids, mode, value]
                  properties:
                    action:
                      type: string
                      enum: [price]
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 500
                      items:
                        type: string
                    mode:
                      type: string
                      enum: [percent, fixed]
                    value:
                      type: number
                      description: percent -90..500, or fixed abs <= 100000
                - type: object
                  required: [action, ids]
                  properties:
                    action:
                      type: string
                      enum: [delete]
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 500
                      items:
                        type: string
      responses:
        '200':
          description: >
            Result depends on action: {"results","summary"} for import,
            {"updated":n} for status/price, {"deleted":n,"archived":n} for delete
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        title:
                          type: string
                        ok:
                          type: boolean
                        error:
                          type: string
                        productId:
                          type: string
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      created:
                        type: integer
                      failed:
                        type: integer
                  updated:
                    type: integer
                  deleted:
                    type: integer
                  archived:
                    type: integer
        '400':
          description: Invalid request, no matching owned products, or price adjustment out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only sellers can manage products in bulk, or vendor account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: productWrite rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: Bulk operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Not used - exists for route clarity only
      tags: [Products]
      security: []
      responses:
        '405':
          description: Use POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/products/export:
    get:
      summary: Export own products (admin can export all) as CSV or JSON
      tags: [Products]
      security:
        - cookieAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, all]
            default: mine
          description: all is admin-only
        - name: ids
          in: query
          schema:
            type: string
          description: Comma-separated product ids to restrict the export
      responses:
        '200':
          description: >
            CSV (text/csv, BOM-prefixed, union header incl. attr.* columns) or JSON
            (application/json attachment {exportedAt, products}; archived admin import format)
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
