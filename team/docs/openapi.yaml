        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to return the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/financing/requests/{id}/forward:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Forward to the financier (BLOCKED unless the checklist is complete)
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: admin:gate-action (60 per minute)
      description: >
        THE GATE'S EXIT (R-4 / DP-23): forwards the request to the financier
        (FORWARDED_TO_FINANCIER, forwardedAt stamped - financier visibility
        starts HERE; financier staff notified). BLOCKED unless every
        required RequirementSubmission is VERIFIED or WAIVED (checked inside
        the same transaction) - incomplete or incorrect requests must be
        RETURNED instead, never forwarded. Works for financing AND
        accreditation requests (auto-detected).
      responses:
        '200':
          description: Forwarded request
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestType:
                    type: string
                    enum: [FINANCING, ACCREDITATION]
                  request:
                    oneOf:
                      - $ref: '#/components/schemas/FinancingRequest'
                      - $ref: '#/components/schemas/AccreditationRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request not in a forwardable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            Gate refused - required checklist items are not all VERIFIED /
            WAIVED-with-note; the body lists the blocking items. Return the
            request instead
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  missing:
                    type: array
                    items:
                      type: object
                      properties:
                        submissionId:
                          type: string
                        requirementId:
                          type: string
                        title:
                          type: string
                        status:
                          type: string
                        isRequired:
                          type: boolean
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to forward the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/financing/submissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: The gate's per-item verdict (VERIFY | REJECT | WAIVE)
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: admin:gate-verdict (120 per minute)
      description: >
        One checklist item: VERIFY stamps verifiedAt + verifiedById (note
        optional); REJECT and WAIVE REQUIRE a note (decisionNote, shown to
        the applicant). After a VERIFY, autoForwardWhenAllVerified
        (financingGeneral) may forward the parent request immediately - an
        admin verdict still happened on every item (automation pre-fills
        verdicts, never skips review - DP-23); the autoForwarded flag says
        whether that fired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [VERIFY]
                    note:
                      type: string
                      maxLength: 500
                - type: object
                  required: [action, note]
                  properties:
                    action:
                      type: string
                      enum: [REJECT, WAIVE]
                    note:
                      type: string
                      minLength: 3
                      maxLength: 500
      responses:
        '200':
          description: Decided submission (+ whether auto-forward fired)
          content:
            application/json:
              schema:
                type: object
                properties:
                  submission:
                    $ref: '#/components/schemas/RequirementSubmission'
                  autoForwarded:
                    type: boolean
        '400':
          description: Invalid verdict / note required but missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Submission not in a decidable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to record the verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
