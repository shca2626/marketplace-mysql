          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/requests/{id}/offers/{offerId}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: offerId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Accept an offer (siblings auto-decline; agreement + fee accrue)
      tags: [Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: financing:accept-offer (20 per 10 minutes)
      description: >
        Accepts one SENT offer: the offer freezes (ACCEPTED + installments),
        every other SENT offer on the request is auto-DECLINED, sibling
        offers across the multiGroupId group are auto-DECLINED too, the
        request closes as ACCEPTED, a FinancingAgreement referencing the
        FROZEN offer is created (AGR-YYYY-###### - DP-20) and a
        FinancingFee(SUCCESS) row is ACCRUED at the platform's
        financierSuccessPercent (invoiced externally - D-002).
      responses:
        '200':
          description: Accepted offer + the created agreement id
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer:
                    $ref: '#/components/schemas/FinancingOffer'
                  agreementId:
                    type: string
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied (only the applicant) / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Offer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Offer expired/withdrawn/already answered, or the request's offers are closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to accept the offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financing/requests/{id}/offers/{offerId}/decline:
