  /api/admin/financing/documents:
    get:
      summary: Platform-wide vault verification queue
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      description: >
        Read-only queue of AccountDocument rows across all users/orgs
        (pending verifications by default; any status filter). ?userId=
        scopes to one applicant's vault - the gate review console joins
        checklist document references against this.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, VERIFIED, REJECTED]
        - name: userId
          in: query
          schema:
            type: string
          description: scope to one applicant's vault
        - name: organizationId
          in: query
          schema:
            type: string
          description: scope to one organization's vault
        - name: documentType
          in: query
          schema:
            type: string
            enum: [NATIONAL_ID, PASSPORT, RESIDENCE_PERMIT, COMMERCIAL_REG, TAX_CARD, BUSINESS_LICENSE, BANK_STATEMENT, FINANCIAL_STATEMENT, PROOF_OF_ADDRESS, GUARANTEE_DOC, FEASIBILITY_STUDY, INVOICE, PURCHASE_ORDER, PROJECT_FILE, OTHER]
      responses:
        '200':
          description: Documents queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountDocument'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the documents queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/financing/documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Platform verification of a vault document (VERIFY | REJECT)
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: admin:document-verify (120 per minute)
      description: >
        Universal vault verification (DP-27): platform verdict on ANY
        user's/org's AccountDocument - VERIFIED (reviewedById + reviewedAt
        stamped, reused by every request type) or REJECTED (note REQUIRED).
        Verified once - a document already decided returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [VERIFY]
                    note:
                      type: string
                      maxLength: 500
                - type: object
                  required: [action, note]
                  properties:
                    action:
                      type: string
                      enum: [REJECT]
                    note:
                      type: string
                      minLength: 3
                      maxLength: 500
                      description: rejection reason shown to the owner
      responses:
        '200':
          description: Decided document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/AccountDocument'
        '400':
          description: Invalid verification / note required but missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Document is already verified/rejected (verified once - R-2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to verify the document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
