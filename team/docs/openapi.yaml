openapi: 3.1.0
info:
  title: Vendora Platform API
  version: 1.0.0
  description: |
    Authentication is a custom HTTP-only cookie session: cookie name `vendora_session`, value
    `${userId}.${expMs}.${HMAC-SHA256}` (signed, expiring, stateless token resolved against the
    users table at request time). Guards: requireUser() rejects with 401 `{"error":"Please sign in first"}`,
    requireAdmin() with 403 `{"error":"Admin access required"}`. Roles: User.role BUYER | SELLER | ADMIN;
    organization membership roles OWNER | ADMIN | BUYER | APPROVER | VIEWER enforced per-service.
    Error model: every error body is `{"error": string}`; zod validation failures return 400 with the
    first issue message; service-layer errors carry their own HTTP status; the rate limiter returns
    429 with a `Retry-After` header.
    Pagination: list endpoints use `page`/`limit` (products: limit 1-48, default 24, envelope
    `{items,total,page,pages}`); the media library uses `limit` 1-60 / `offset` with envelope
    `{assets,errors,total,limit,offset}`. All other list endpoints return unpaginated arrays.
    This contract documents the single deployed SPA backend; there is no versioned API surface yet
    (see team/docs/03-api-contract.md, section 7). Paths under /api/financing* and /api/financiers*
    are PLANNED (marked `x-planned: true`) and are not implemented.
servers:
  - url: /
    description: Relative to the Caddy gateway origin that fronts this Next.js app (single deployment)
externalDocs:
  description: API conventions, CSRF and rate-limit policies, coverage matrix
  url: https://github.com/vendora/team/docs/03-api-contract.md
tags:
  - name: Auth
    description: Cookie session login/register/logout and account upgrade
  - name: Catalog
    description: Public category attribute definitions powering dynamic forms and filters
  - name: Categories
    description: Public category listing with live product counts
  - name: Home
    description: Aggregated landing-page feed
  - name: Products
    description: Product CRUD, bulk ops, export (seller/admin)
  - name: Favorites
    description: Buyer wishlist toggle
  - name: Reviews
    description: Product reviews with verified-purchase badge
  - name: Orders
    description: Checkout, purchase history, fulfillment, cancellation, per-order payment
  - name: Payments
    description: Public checkout method catalog
  - name: Pricing
    description: B2B price resolution (contract / customer-group / retail)
  - name: Quotes
    description: Quote lifecycle on RFQs (accept, decline, withdraw, convert, PDF, admin review)
  - name: RFQs
    description: Requests-for-quote, negotiation messages, seller inbox, public display config
  - name: Approvals
    description: Organization purchase-approval queue and decisions
  - name: Disputes
    description: Buyer-seller dispute lifecycle
  - name: Recurring RFQs
    description: Scheduled RFQ generation, pause/resume/skip
  - name: Organizations
    description: Business accounts, members, approval policy
  - name: Sellers
    description: Public seller storefront profiles
  - name: Seller Console
    description: Vendor dashboards (stats, orders, earnings)
  - name: Notifications
    description: In-app bell feed and read state
  - name: Media
    description: Immutable rendition serving (public, cache-forever)
  - name: Uploads
    description: Image upload pipeline and media library (seller/admin)
  - name: Storefront Settings
    description: Public storefront configuration + active slides
  - name: 'Admin: Audit'
  - name: 'Admin: Coupons'
  - name: 'Admin: Customer Groups'
  - name: 'Admin: Disputes'
  - name: 'Admin: Orders'
  - name: 'Admin: Organizations'
  - name: 'Admin: Payments'
  - name: 'Admin: Payouts'
  - name: 'Admin: Price Lists'
  - name: 'Admin: Quotes'
  - name: 'Admin: RFQs'
  - name: 'Admin: RFQ Settings'
  - name: 'Admin: Settings'
  - name: 'Admin: Slides'
  - name: 'Admin: Stats'
  - name: 'Admin: Vendors'
  - name: Financing (planned)
    description: >
      Planned financier domain (PLATFORM_PLAN P1, FINANCIER_SCHEMA v4.0). None of these
      endpoints exist in code yet; every path carries x-planned: true.
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vendora_session
      description: >
        Custom session cookie set by POST /api/auth/login and POST /api/auth/register.
        Value `${userId}.${expMs}.${HMAC-SHA256}`; httpOnly, SameSite=Lax, Secure in production,
        path=/, server-side max age 30 days (MAX_AGE). Suspended accounts stop resolving.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    SessionUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [BUYER, SELLER, ADMIN]
        image:
          type: [string, 'null']
        storeName:
          type: [string, 'null']
        storeBio:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ProductSummary:
      type: object
      description: serializeProduct() DTO (fields below are the stable core; serializer adds commerce detail)
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        compareAtPrice:
          type: [number, 'null']
        images:
          type: array
          items:
            type: string
        categoryId:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
        sellerId:
          type: string
        stock:
          type: integer
        soldCount:
          type: integer
        rating:
          type: number
        reviewCount:
          type: integer
        featured:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DRAFT, ARCHIVED]
        favorited:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ProductList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
        page:
          type: integer
        pages:
          type: integer
    ProductForm:
      type: object
      description: Shared productFormSchema (POST /api/products and PUT /api/products/{id})
      required: [title, description, price, categoryId, stock]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 4000
        price:
          type: number
          exclusiveMinimum: 0
        compareAtPrice:
          type: [number, 'null']
          exclusiveMinimum: 0
        images:
          type: array
          maxItems: 6
          items:
            type: string
            maxLength: 2048
          description: http(s) URLs or uploaded /api/media keys; publish (status ACTIVE) requires >= 1
        categoryId:
          type: string
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        status:
          type: string
          enum: [ACTIVE, DRAFT]
        sku:
          type: [string, 'null']
          maxLength: 64
        barcode:
          type: [string, 'null']
          maxLength: 64
        videoUrl:
          type: [string, 'null']
          maxLength: 512
        highlights:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 160
        specs:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 60
              value:
                type: string
                maxLength: 200
        materials:
          type: [string, 'null']
          maxLength: 500
        care:
          type: [string, 'null']
          maxLength: 500
        weightGrams:
          type: [integer, 'null']
          minimum: 1
          maximum: 2000000
        lengthCm:
          type: [number, 'null']
        widthCm:
          type: [number, 'null']
        heightCm:
          type: [number, 'null']
        processingDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 30
        freeShipping:
          type: boolean
        shippingFee:
          type: [number, 'null']
          maximum: 10000
        shippingPolicy:
          type: [string, 'null']
          maxLength: 1000
        slug:
          type: [string, 'null']
          maxLength: 180
        metaTitle:
          type: [string, 'null']
          maxLength: 150
        metaDescription:
          type: [string, 'null']
          maxLength: 320
        moq:
          type: [integer, 'null']
          maximum: 1000000
        priceTiers:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              from:
                type: integer
              to:
                type: [integer, 'null']
              price:
                type: number
        variants:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProductVariantInput'
    ProductVariantInput:
      type: object
      required: [name, stock]
      properties:
        name:
          type: string
          maxLength: 200
        options:
          type: object
          additionalProperties:
            type: string
        price:
          type: [number, 'null']
        compareAtPrice:
          type: [number, 'null']
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        sku:
          type: [string, 'null']
        isActive:
          type: boolean
    Review:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        userId:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        sellerId:
          type: string
        title:
          type: string
        image:
          type: [string, 'null']
        price:
          type: number
        quantity:
          type: integer
        variantId:
          type: [string, 'null']
        variantName:
          type: [string, 'null']
        mine:
          description: Present on seller-scoped serializations; true when the item belongs to that seller
          type: boolean
    Order:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
        status:
          type: string
          enum: [PENDING_APPROVAL, PENDING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
        fullName:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        zip:
          type: string
        phone:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        paymentTerms:
          type: [string, 'null']
        poNumber:
          type: [string, 'null']
        sourceType:
          type: [string, 'null']
        buyer:
          type: [object, 'null']
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        payment:
          type: [object, 'null']
          properties:
            method:
              type: string
            status:
              type: string
            reference:
              type: [string, 'null']
            instructions:
              type: [string, 'null']
            dueAt:
              type: [string, 'null']
              format: date-time
            paidAt:
              type: [string, 'null']
              format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    MediaAsset:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
          description: Storage base key; renditions are served under /api/media/{key}
        originalName:
          type: string
        mime:
          type: string
        size:
          type: integer
        width:
          type: integer
        height:
          type: integer
        sha256:
          type: string
        variants:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        linkView:
          type: [string, 'null']
        linkId:
          type: [string, 'null']
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    AuditLog:
      type: object
      properties:
        id:
          type: string
        actorId:
          type: [string, 'null']
        actorType:
          type: string
          enum: [USER, ADMIN, SYSTEM]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: [string, 'null']
        summary:
          type: string
        metadata:
          description: Json column; the financing domain deliberately avoids it (DP-15)
        createdAt:
          type: string
          format: date-time
    RfqLineInput:
      type: object
      required: [quantity]
      properties:
        productId:
          type: [string, 'null']
        productName:
          type: [string, 'null']
          maxLength: 200
        sku:
          type: [string, 'null']
          maxLength: 80
        variantId:
          type: [string, 'null']
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        targetPrice:
          type: [number, 'null']
        notes:
          type: [string, 'null']
          maxLength: 2000
      description: productId or productName must be present (refined in zod)
    Rfq:
      type: object
      description: Service-serialized RFQ (summary shape; number, status, lines, quote counts)
      properties:
        id:
          type: string
        number:
          type: string
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        status:
          type: string
          description: DRAFT | OPEN | REVIEW | ORDERED | CLOSED | REJECTED | CANCELLED (service lifecycle)
        organizationId:
          type: [string, 'null']
        userId:
          type: string
        lines:
          type: array
          items:
            type: object
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        createdAt:
          type: string
          format: date-time
    Quote:
      type: object
      description: Service-serialized quote (summary shape)
      properties:
        id:
          type: string
        number:
          type: string
        rfqId:
          type: string
        sellerId:
          type: [string, 'null']
          description: null = platform-facilitated quote issued by an admin
        status:
          type: string
          enum: [SENT, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN, CONVERTED]
        currency:
          type: string
        subtotal:
          type: number
        discountTotal:
          type: number
        shippingTotal:
          type: number
        taxTotal:
          type: number
        total:
          type: number
        paymentTerms:
          type: [string, 'null']
        validUntil:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
        lines:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
    FinancingRequestPlanned:
      type: object
      description: >
        PLANNED summary shape of FinancingRequest (FINANCIER_SCHEMA v4.0 section 3.5).
        Not implemented; field names are authoritative for the future implementation.
      properties:
        id:
          type: string
        number:
          type: string
          description: FR-YYYY-###### (Sequence FIN)
        organizationId:
          type: [string, 'null']
        createdById:
          type: string
        productId:
          type: [string, 'null']
        targetType:
          type: string
          enum: [WORKING_CAPITAL, QUOTE, ORDER, RFQ_LINE]
        targetId:
          type: [string, 'null']
        activityStatus:
          type: [string, 'null']
          enum: [NEW, EXISTING]
        capitalAmount:
          type: [number, 'null']
        ownContributionAmount:
          type: [number, 'null']
        monthlyInstallmentCapacity:
          type: [number, 'null']
        previousFinancing:
          type: [boolean, 'null']
        otherIncomeSources:
          type: [string, 'null']
        amountRequested:
          type: number
        currency:
          type: string
        purpose:
          type: [string, 'null']
        tenorRequestedMonths:
          type: [integer, 'null']
        guaranteeType:
          type: [string, 'null']
        guaranteeStatus:
          type: [string, 'null']
        activityCategory:
          type: [string, 'null']
        status:
          type: string
          description: DRAFT | SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | OFFERED | ACCEPTED | DECLINED_ALL | EXPIRED | CANCELLED | WITHDRAWN
        distributionMode:
          type: string
          enum: [OPEN, BUYER_SELECTED]
        consentAt:
          type: [string, 'null']
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    FinancingOfferPlanned:
      type: object
      description: >
        PLANNED summary shape of FinancingOffer (FINANCIER_SCHEMA v4.0 section 3.8).
        Not implemented.
      properties:
        id:
          type: string
        requestId:
          type: string
        createdById:
          type: string
        amount:
          type: number
        currency:
          type: string
        rateType:
          type: [string, 'null']
          enum: [MURABAHA_ANNUAL, FIXED_ANNUAL, FLAT_FEE]
        ratePercent:
          type: [number, 'null']
        feeFlat:
          type: [number, 'null']
        tenorMonths:
          type: integer
        collateralRequired:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        validUntil:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [DRAFT, SENT, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        installments:
          type: array
          items:
            type: object
            properties:
              installmentNo:
                type: integer
              dueDate:
                type: string
                format: date
              amount:
                type: number
        createdAt:
          type: string
          format: date-time
    RateLimited:
      type: object
      properties:
        error:
          type: string
          enum: ['Too many requests - slow down and try again shortly']
      description: 429 body; accompanied by a Retry-After header (seconds)
    CsrfRejected:
      type: object
      properties:
        error:
          type: string
          enum: ['Cross-site requests are not allowed']
      description: 403 body from assertSameOrigin; accompanied by X-Reason header
paths:
  /api:
    get:
      summary: API root liveness ping
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Static hello response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/auth/login:
    post:
      summary: Sign in with email + password; sets the vendora_session cookie
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Signed in; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '400':
          description: Invalid input (zod first issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account SUSPENDED by platform administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Login failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      summary: Clear the session cookie
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
  /api/auth/me:
    get:
      summary: Current session user (null when signed out)
      tags: [Auth]
      security: []
      responses:
        '200':
          description: "Session state; body is {\"user\": null} when unauthenticated (never 401)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/SessionUser'
                      - type: 'null'
  /api/auth/register:
    post:
      summary: Register a BUYER or SELLER account; sets the session cookie
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 60
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  maxLength: 100
                role:
                  type: string
                  enum: [BUYER, SELLER]
                  default: BUYER
                storeName:
                  type: [string, 'null']
                  maxLength: 60
      responses:
        '201':
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '400':
          description: Invalid input (zod first issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/become-seller:
    post:
      summary: Upgrade a BUYER account to SELLER (admins rejected)
      tags: [Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeName]
              properties:
                storeName:
                  type: string
                  minLength: 2
                  maxLength: 60
                storeBio:
                  type: [string, 'null']
                  maxLength: 300
      responses:
        '200':
          description: Upgraded (or already a seller - idempotent return)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '400':
          description: Invalid input (zod first issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin accounts already have full marketplace access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to upgrade account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/catalog:
    get:
      summary: Category attribute definitions for dynamic seller forms and filters
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Static catalog definitions (CATEGORY_CATALOG, CONDITIONS, PRODUCT_CONDITIONS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                  conditions:
                    type: array
                    items:
                      type: object
                  conditionValues:
                    type: array
                    items:
                      type: string
        '500':
          description: Failed to load catalog definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories:
    get:
      summary: All categories with ACTIVE product counts and a cover image
      tags: [Categories]
      security: []
      responses:
        '200':
          description: Category list ordered by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
