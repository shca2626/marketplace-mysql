    post:
      summary: Checkout - create an order (optionally org-approval routed)
      tags: [Orders]
      security:
        - cookieAuth: []
      description: >
        Server-authoritative pricing and stock validation. CARD settles inline (simulated gateway);
        BANK_TRANSFER parks the order in PENDING_PAYMENT; org members at/over the approval
        threshold route to PENDING_APPROVAL instead of settling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, fullName, address, city, country, zip]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 99
                      variantId:
                        type: [string, 'null']
                fullName:
                  type: string
                  maxLength: 80
                address:
                  type: string
                  maxLength: 200
                city:
                  type: string
                  maxLength: 80
                country:
                  type: string
                  maxLength: 80
                zip:
                  type: string
                  maxLength: 20
                phone:
                  type: [string, 'null']
                  maxLength: 30
                couponCode:
                  type: [string, 'null']
                  maxLength: 24
                paymentMethod:
                  type: string
                  enum: [CARD, BANK_TRANSFER]
                  description: Absent defaults to CARD (legacy callers)
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  pendingApproval:
                    type: boolean
                  pendingPayment:
                    type: boolean
                  payment:
                    type: [object, 'null']
                    properties:
                      method:
                        type: string
                      status:
                        type: string
                      instructions:
                        type: [string, 'null']
                      dueAt:
                        type: [string, 'null']
                  pricing:
                    type: object
                    properties:
                      subtotal:
                        type: number
                      discount:
                        type: number
                      shipping:
                        type: number
                      total:
                        type: number
                      couponCode:
                        type: [string, 'null']
        '400':
          description: >
            Validation error, empty cart, unavailable product/variant, insufficient stock,
            suspended vendor, or invalid coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
