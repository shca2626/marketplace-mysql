  # ─────────────────────────────────────────────────────────────────────────────
  # PLANNED financier domain v5.0 — FINANCIER_SCHEMA.md v5.0 (services · platform
  # gate · requirements engine) / FINANCIER_PLAN.md v2.0 section 6. None of these
  # paths exist in code yet; every operation carries x-planned: true. Field names
  # are FINANCIER_SCHEMA v5.0-exact.
  # ─────────────────────────────────────────────────────────────────────────────

  # Group 1 — Services & requirements (financier console)
  /api/financier/services:
    get:
      summary: PLANNED - list the financier's own services (with requirement counts)
      tags: [Financier Console (planned)]
      security:
        - cookieAuth: []
      x-planned: true
      description: >
        Not implemented. Financier console: services of the caller's institution
        (OrganizationMember OWNER/ADMIN of a BANK/MFI/EWALLET org with an ACTIVE
        FinancierProfile - DP-1, no global FINANCIER role). Each item is joined
        with its count of active ServiceRequirement rows. Source - FINANCIER_SCHEMA
        v5.0 section 3.4, FINANCIER_PLAN v2.0 section 6.
      parameters:
        - name: serviceKind
          in: query
          schema:
            type: string
            enum: [FINANCING, ACCREDITATION]
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
        - name: q
          in: query
          schema:
            type: string
          description: Planned - free-text search on name/summary
      responses:
        '200':
          description: Own services with requirement counts (planned shape)
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/FinancierService'
                        - type: object
                          properties:
                            requirementCount:
                              type: integer
                              description: Count of active ServiceRequirement rows on the service
        '401':
          description: Please sign in first (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a financier org OWNER/ADMIN (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: PLANNED - create a service (serviceKind FINANCING or ACCREDITATION)
      tags: [Financier Console (planned)]
      security:
        - cookieAuth: []
      x-planned: true
      x-csrf: planned assertSameOrigin (mutations follow the platform CSRF policy)
      description: >
        Not implemented. serviceKind FINANCING creates a financing service
        (category from the B2B trio + market taxonomy); serviceKind ACCREDITATION
        creates the financier's qualification program (accreditationValidMonths /
        accreditationFeeAmount apply). Field names mirror FINANCIER_SCHEMA v5.0
        section 3.4 exactly (DP-22 - services, not products).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceKind, category, name]
              properties:
                serviceKind:
                  type: string
                  enum: [FINANCING, ACCREDITATION]
                category:
                  type: string
                  description: >
                    FINANCING - WORKING_CAPITAL | INVOICE_FINANCING | PO_FINANCING |
                    EQUIPMENT | VEHICLE | HOME | EDUCATION | AGRICULTURE |
                    MICROENTERPRISE | SME | OTHER; ACCREDITATION -
                    SUPPLIER_QUALIFICATION | VENDOR_APPROVAL
                name:
                  type: string
                  maxLength: 160
                summary:
                  type: [string, 'null']
                  maxLength: 500
                description:
                  type: [string, 'null']
                targetSegment:
                  type: [string, 'null']
                  enum: [BUSINESS, INDIVIDUAL, BOTH]
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, ARCHIVED]
                  default: ACTIVE
                currency:
                  type: string
                  default: YER
                  description: ISO-4217; no currency table
                amountMin:
                  type: [number, 'null']
                amountMax:
                  type: [number, 'null']
                  description: null = open (ACCREDITATION kinds)
                rateType:
                  type: [string, 'null']
                  enum: [MURABAHA_ANNUAL, FIXED_ANNUAL, FLAT_FEE]
                rateMax:
                  type: [number, 'null']
                feeFlat:
                  type: [number, 'null']
                tenorMinMonths:
                  type: [integer, 'null']
                tenorMaxMonths:
                  type: [integer, 'null']
                repaymentFrequency:
                  type: [string, 'null']
                  enum: [MONTHLY, QUARTERLY, LUMP_SUM]
                gracePeriodDays:
                  type: [integer, 'null']
                shariaCompliant:
                  type: boolean
                  default: false
                processingDays:
                  type: [integer, 'null']
                accreditationValidMonths:
                  type: [integer, 'null']
                  description: ACCREDITATION kind only - lifetime of the grant once ACCREDITED
                accreditationFeeAmount:
                  type: [number, 'null']
                  description: ACCREDITATION kind only - fee, invoiced externally (D-002)
      responses:
        '201':
          description: Created service (planned shape)
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    $ref: '#/components/schemas/FinancierService'
        '400':
          description: Invalid input (planned - follows the platform error model)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a financier org OWNER/ADMIN (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
