              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the condition library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a GENERAL condition template
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: admin:conditions (60 per minute)
      description: >
        Creates a ConditionTemplate with scope forced to GENERAL
        (organizationId null - platform library, admin-only - DP-24). Same
        body and kind-shape rules as the financier-private create (DOCUMENT
        needs documentType; PROFILE_FIELD needs profileFieldKey; SELECT /
        MULTI_SELECT need >= 2 options).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conditionType, title]
              properties:
                conditionType:
                  type: string
                  enum: [DOCUMENT, PROFILE_FIELD, DECLARATION, TEXT, NUMBER, DATE, SELECT, MULTI_SELECT]
                title:
                  type: string
                  minLength: 3
                  maxLength: 160
                code:
                  type: [string, 'null']
                  maxLength: 32
                description:
                  type: [string, 'null']
                  maxLength: 1000
                profileFieldKey:
                  type: [string, 'null']
                documentType:
                  type: [string, 'null']
                validationMin:
                  type: [number, 'null']
                validationMax:
                  type: [number, 'null']
                validityMonths:
                  type: [integer, 'null']
                isRepeatable:
                  type: boolean
                options:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 120
      responses:
        '201':
          description: Created GENERAL condition template
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/ConditionTemplate'
        '400':
          description: Invalid condition payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to create the condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
