  /api/financier/offers:
    get:
      summary: All offers on a forwarded request (financier view, incl. drafts)
      tags: [Financier]
      security:
        - cookieAuth: []
      parameters:
        - name: requestId
          in: query
          required: true
          schema:
            type: string
          description: the forwarded financing request
      description: >
        Every offer on the request (DRAFT included) - the applicant-side
        detail never includes DRAFTs. Guard chain: financier staff of the
        request's org; pre-forward requests 404.
      responses:
        '200':
          description: Offers on the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancingOffer'
        '400':
          description: requestId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found / not forwarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create an offer (+installments) and optionally send it
      tags: [Financier]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: financier:offer (40 per 10 minutes)
      description: >
        Compose an offer on a FORWARDED+ request (FORWARDED_TO_FINANCIER /
        UNDER_FINANCIER_REVIEW / OFFERED). send:false (default) leaves it
        DRAFT; send:true sends immediately (DRAFT → SENT, first SENT offer
        moves the request to OFFERED, applicant notified). Revisions = new
        offer rows (the previous stays for comparison - DP-12); the
        platform caps offers per request
        (financingGeneral.maxOffersPerRequest, default 5). validUntil
        defaults to +14 days when sent without one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, amount, tenorMonths]
              properties:
                requestId:
                  type: string
                amount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000000
                tenorMonths:
                  type: integer
                  minimum: 1
                  maximum: 120
                rateType:
                  type: [string, 'null']
                  enum: [MURABAHA_ANNUAL, FIXED_ANNUAL, FLAT_FEE]
                ratePercent:
                  type: [number, 'null']
                  minimum: 0
                  maximum: 100
                feeFlat:
                  type: [number, 'null']
                  minimum: 0
                collateralRequired:
                  type: [string, 'null']
                  maxLength: 24
                  description: enum from the guarantee taxonomy (FINANCIER_SCHEMA v5.0 section 3.8)
                notes:
                  type: [string, 'null']
                  maxLength: 1000
                validUntil:
                  type: [string, 'null']
                  description: must be a future date when set
                installments:
                  type: array
                  maxItems: 120
                  description: FinancingOfferInstallment rows (the proposed schedule)
                  items:
                    type: object
                    required: [installmentNo, dueDate, amount]
                    properties:
                      installmentNo:
                        type: integer
                        minimum: 1
                        maximum: 600
                      dueDate:
                        type: string
                      amount:
                        type: number
                        exclusiveMinimum: 0
                send:
                  type: boolean
                  description: when true, sends the offer in the same call
      responses:
        '201':
          description: Created (and optionally sent) offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer:
                    $ref: '#/components/schemas/FinancingOffer'
        '400':
          description: Invalid offer payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the request's financier / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found / not forwarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Offers closed for this request / per-request cap reached / validity not future
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to create the offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
