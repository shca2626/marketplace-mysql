      tags: [Uploads]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: upload (30 per 10 min per user)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files (max per-request bound by UPLOAD_LIMITS.maxFilesPerRequest; 8 MB each)
      responses:
        '201':
          description: Partial or full success; assets array may coexist with per-file errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaAsset'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        error:
                          type: string
        '400':
          description: Expected multipart/form-data, no file provided, or too many files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only sellers can upload media / suspended vendor / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: "Every file failed processing (body {assets: [], errors: [...]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items: {}
                  errors:
                    type: array
                    items:
                      type: object
        '429':
          description: upload rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
    get:
      summary: My media library (admin sees all), newest first
