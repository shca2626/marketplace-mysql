  /api/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Single order (buyer, participating seller, or admin)
      tags: [Orders]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Order detail (seller view flags items.mine)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not a party to the order)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Seller advances fulfillment, OR buyer cancels (action=cancel)
      tags: [Orders]
      security:
        - cookieAuth: []
      description: >
        Two discriminated bodies: {"action":"cancel"} (buyer; allowed from PAID, PENDING_APPROVAL
        and PENDING_PAYMENT; restocks items and voids payment/approval) or
        {"status":"PROCESSING"|"SHIPPED"|"DELIVERED"} (seller/admin; strictly one step forward in
        PAID -> PROCESSING -> SHIPPED -> DELIVERED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [cancel]
                - type: object
                  required: [status]
                  properties:
                    status:
                      type: string
                      enum: [PROCESSING, SHIPPED, DELIVERED]
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status, illegal transition, or cancellation no longer possible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the buyer can cancel / only the seller can update fulfillment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/orders/{id}/pay:
    post:
      summary: Buyer settles a PENDING_PAYMENT order
      tags: [Orders]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [CARD, BANK_TRANSFER, INVOICE]
                reference:
                  type: string
                  maxLength: 160
                  description: Bank-transfer reference the operator will verify
      responses:
        '200':
          description: Payment result and order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  paid:
                    type: boolean
                  payment:
                    type: [object, 'null']
                    properties:
                      id:
                        type: string
                      method:
                        type: string
                      status:
                        type: string
                      reference:
                        type: [string, 'null']
                      instructions:
                        type: [string, 'null']
                      dueAt:
                        type: [string, 'null']
                      amount:
                        type: number
                  order:
                    type: [object, 'null']
                    properties:
                      id:
                        type: string
                      status:
                        type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found (from PaymentServiceError status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to process payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/coupons/validate:
    post:
      summary: Preview a coupon against the current cart subtotal (display-only)
      tags: [Pricing]
      security: []
      description: POST /api/orders re-validates authoritatively at checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 24
                subtotal:
                  type: number
                  minimum: 0
                  maximum: 1000000
      responses:
        '200':
          description: Coupon preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  coupon:
                    type: object
                    properties:
                      code:
                        type: string
                      percentOff:
                        type: integer
                      description:
                        type: [string, 'null']
                  discount:
                    type: number
        '400':
          description: Invalid request or subtotal below the coupon minimum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sign in to use this code (firstOrderOnly codes for anonymous callers)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Code does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to validate coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pricing/resolve:
    post:
      summary: Resolve unit prices for the current buyer context (your-price display)
      tags: [Pricing]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 1000000
                organizationId:
                  type: [string, 'null']
      responses:
        '200':
          description: Resolved prices with buyer context
          content:
            application/json:
              schema:
                type: object
                properties:
                  context:
                    type: object
                    properties:
                      organizationId:
                        type: [string, 'null']
                      organizationStatus:
                        type: [string, 'null']
                      customerGroupIds:
                        type: array
                        items:
                          type: string
                  prices:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        unitPrice:
                          type: number
                        listPrice:
                          type: number
                        source:
                          type: string
                          enum: [CONTRACT, GROUP, RETAIL]
                        savings:
                          type: number
        '400':
          description: Invalid input (zod first issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to resolve prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
