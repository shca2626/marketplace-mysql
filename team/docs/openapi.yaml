      responses:
        '200':
          description: Payment result and order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  paid:
                    type: boolean
                  payment:
                    type: [object, 'null']
                    properties:
                      id:
                        type: string
                      method:
                        type: string
                      status:
                        type: string
                      reference:
                        type: [string, 'null']
                      instructions:
                        type: [string, 'null']
                      dueAt:
                        type: [string, 'null']
                      amount:
                        type: number
                  order:
                    type: [object, 'null']
                    properties:
                      id:
                        type: string
                      status:
                        type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found (from PaymentServiceError status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to process payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/coupons/validate:
