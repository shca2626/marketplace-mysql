          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: PLANNED - create a financing request (wizard payload + submissions)
      tags: [Financing (planned)]
      security:
        - cookieAuth: []
      x-planned: true
      x-csrf: planned assertSameOrigin (mutations follow the platform CSRF policy)
      description: >
        Not implemented. Creates the FinancingRequest from the 3-step wizard v5
        (FINANCIER_PLAN v2.0 flow 5): service-scoped (serviceId REQUIRED - DP-22),
        typed activity columns, RequirementSubmission rows for the service's
        checklist, stamps consentAt when consent is true, assigns number
        FR-YYYY-###### (Sequence FIN), status SUBMITTED -> platform gate queue.
        Multi-financier apply (DP-25) issues one request per selected service;
        sibling requests share multiGroupId. Field names mirror FINANCIER_SCHEMA
        v5.0 sections 3.8 / 3.6 exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, amountRequested, consent]
              properties:
                serviceId:
                  type: string
                  description: the applied-for FinancierService (serviceKind FINANCING enforced)
                organizationId:
                  type: [string, 'null']
                  description: applicant org context; null/absent = individual (DP-13)
                targetType:
                  type: string
                  enum: [WORKING_CAPITAL, QUOTE, ORDER, RFQ_LINE]
                targetId:
                  type: [string, 'null']
                  description: quote/order/rfqLine id (loose FK, Dispute pattern)
                multiGroupId:
                  type: [string, 'null']
                  description: >
                    DP-25 - present when this request belongs to a multi-financier
                    sibling group (the wizard mints the group id and passes it to
                    every sibling); absent = exclusive routing
                activityStatus:
                  type: [string, 'null']
                  enum: [NEW, EXISTING]
                activityName:
                  type: [string, 'null']
                  maxLength: 160
                activityDescription:
                  type: [string, 'null']
                activityStartDate:
                  type: [string, 'null']
                  format: date
                  description: null = not started yet
                activityCity:
                  type: [string, 'null']
                  maxLength: 120
                  description: free string, matched against service coverage (DP-16)
                activityDistrict:
                  type: [string, 'null']
                  maxLength: 120
                activityAddress:
                  type: [string, 'null']
                  maxLength: 255
                activityLocationType:
                  type: [string, 'null']
                  enum: [OWNED, RENTED]
                activityCategory:
                  type: [string, 'null']
                  maxLength: 24
                activityCategoryOther:
                  type: [string, 'null']
                  maxLength: 160
                  description: free text when activityCategory = OTHER
                capitalAmount:
                  type: [number, 'null']
                ownContributionAmount:
                  type: [number, 'null']
                monthlyInstallmentCapacity:
                  type: [number, 'null']
                previousFinancing:
                  type: [boolean, 'null']
                otherIncomeSources:
                  type: [string, 'null']
                  maxLength: 500
                amountRequested:
                  type: number
                currency:
                  type: string
                  default: YER
                  description: ISO-4217; no currency table
                purpose:
                  type: [string, 'null']
                tenorRequestedMonths:
                  type: [integer, 'null']
                guaranteeType:
                  type: [string, 'null']
                  enum: [PERSONAL_GUARANTEE, BANK_GUARANTEE, GOLD, COMMERCIAL, MORTGAGE, CONVERTIBLE_SECURITIES, SELF_GUARANTEE, OTHER]
                guaranteeTypeOther:
                  type: [string, 'null']
                  maxLength: 160
                guaranteeStatus:
                  type: [string, 'null']
                  enum: [AVAILABLE, PARTIALLY_AVAILABLE, UNAVAILABLE, OTHER]
                guaranteeStatusOther:
                  type: [string, 'null']
                  maxLength: 160
                applicantNotes:
                  type: [string, 'null']
                consent:
                  type: boolean
                  description: data-transfer consent + terms; stamps consentAt at submit
                submissions:
                  type: array
                  description: >
                    RequirementSubmission inputs for the service's checklist
                    (serviceRequirementId + the typed value column matching the
                    condition kind; DOCUMENT items reference an AccountDocument)
                  items:
                    type: object
                    required: [serviceRequirementId]
                    properties:
                      serviceRequirementId:
                        type: string
                      valueText:
                        type: [string, 'null']
                        maxLength: 500
                      valueNumber:
                        type: [number, 'null']
                      valueDate:
                        type: [string, 'null']
                        format: date
                      accountDocumentId:
                        type: [string, 'null']
                        description: reuse of a vault document (uploaded once - R-2)
                attachments:
                  type: array
                  description: free RequestAttachment links (wizard field 20 - guarantee docs, studies, project files)
                  items:
                    type: object
                    required: [accountDocumentId]
                    properties:
                      accountDocumentId:
                        type: string
                      kind:
                        type: string
                        enum: [GUARANTEE_DOC, STUDY, PROJECT_FILE, OTHER]
      responses:
        '201':
          description: Created financing request (planned shape)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/FinancingRequestPlanned'
        '400':
          description: Invalid input (planned - follows the platform error model)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Service not found (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Service not ACTIVE / not a FINANCING-kind service (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
