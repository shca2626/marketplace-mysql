  /api/financier/conditions:
    get:
      summary: Searchable condition library (own private + GENERAL)
      tags: [Financier]
      security:
        - cookieAuth: []
      description: >
        Requirements engine (DP-24): the composer's visible library (R-5) -
        GENERAL active templates plus the caller's own org's FINANCIER-scope
        templates. Searchable by title/code; filterable by conditionType.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: free-text search on title/code (alias - search)
        - name: conditionType
          in: query
          schema:
            type: string
            enum: [DOCUMENT, PROFILE_FIELD, DECLARATION, TEXT, NUMBER, DATE, SELECT, MULTI_SELECT]
        - name: includeInactive
          in: query
          schema:
            type: boolean
          description: include isActive=false templates (default false)
      responses:
        '200':
          description: Visible condition templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConditionTemplate'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required (admin sees the GENERAL library)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the condition library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a private condition template
      tags: [Financier]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: financier:conditions (60 per 10 minutes)
      description: >
        Creates a ConditionTemplate with scope forced to FINANCIER
        (organizationId = caller's institution - the GENERAL library is
        admin-managed, DP-24). SELECT / MULTI_SELECT choices are
        ConditionOption rows, never JSON (R-1). Kind rules: DOCUMENT needs a
        documentType; PROFILE_FIELD needs a profileFieldKey; SELECT /
        MULTI_SELECT need at least two options; only those kinds carry
        options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conditionType, title]
              properties:
                conditionType:
                  type: string
                  enum: [DOCUMENT, PROFILE_FIELD, DECLARATION, TEXT, NUMBER, DATE, SELECT, MULTI_SELECT]
                title:
                  type: string
                  minLength: 3
                  maxLength: 160
                code:
                  type: [string, 'null']
                  maxLength: 32
                  description: optional stable ref, e.g. COM-REG (globally unique when set)
                description:
                  type: [string, 'null']
                  maxLength: 1000
                profileFieldKey:
                  type: [string, 'null']
                  description: >
                    PROFILE_FIELD only - closed set - user.phone | user.identityNumber |
                    user.dateOfBirth | org.taxId | org.registrationNumber | org.industry
                documentType:
                  type: [string, 'null']
                  description: >
                    DOCUMENT only - expected AccountDocument.documentType (NATIONAL_ID |
                    PASSPORT | RESIDENCE_PERMIT | COMMERCIAL_REG | TAX_CARD | BUSINESS_LICENSE
                    | BANK_STATEMENT | FINANCIAL_STATEMENT | PROOF_OF_ADDRESS | GUARANTEE_DOC
                    | FEASIBILITY_STUDY | INVOICE | PURCHASE_ORDER | PROJECT_FILE | OTHER)
                validationMin:
                  type: [number, 'null']
                  description: NUMBER only - inclusive lower bound
                validationMax:
                  type: [number, 'null']
                  description: NUMBER only - inclusive upper bound
                validityMonths:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 120
                  description: evidence freshness window (e.g. bank statement 3 months)
                isRepeatable:
                  type: boolean
                  description: DOCUMENT only - multiple docs allowed
                options:
                  type: array
                  maxItems: 20
                  description: SELECT / MULTI_SELECT choice values (ConditionOption rows)
                  items:
                    type: string
                    minLength: 1
                    maxLength: 120
      responses:
        '201':
          description: Created condition template
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: '#/components/schemas/ConditionTemplate'
        '400':
          description: Invalid condition payload (zod or kind-shape rules)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to create the condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
