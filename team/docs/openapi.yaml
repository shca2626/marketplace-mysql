  # ─────────────────────────────────────────────────────────────────────────────
  # FINANCIER DOMAIN — IMPLEMENTED (shipped as the financier module FIN-1…FIN-9,
  # 2026-09-26). FINANCIER_SCHEMA v5.0: services-not-products, THE platform
  # verification gate, requirements engine, universal documents, accreditation
  # as a main service, multi-financier routing. 18 models, 61 routes.
  # Guards: requireUser (401) / requireAdmin (403) / requireFinancierContext =
  # OWNER|ADMIN member of an org with a FinancierProfile (403 otherwise — DP-1,
  # no global FINANCIER role). Every unsafe method is CSRF-guarded
  # (assertSameOrigin) and rate-limited; read paths run the lazy expiry sweep
  # (SUBMITTED/… pre-terminal requests past expiresAt → EXPIRED).
  # ─────────────────────────────────────────────────────────────────────────────

  # Group 1 — Services & requirements (financier console)
  /api/financier/services:
    get:
      summary: List the financier institution's own services (any status)
      tags: [Financier]
      security:
        - cookieAuth: []
      description: >
        Financier console: FinancierService rows of the caller's institution
        (OrganizationMember OWNER/ADMIN of a BANK/MFI/EWALLET org with a
        FinancierProfile — DP-1), each joined with its active
        ServiceRequirement count, FEATURE / ELIGIBILITY_CONDITION text
        attributes and coverage regions.
      responses:
        '200':
          description: Own services with requirement counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancierService'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required (not an OWNER/ADMIN of a financier org)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load your services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a service (FINANCING or ACCREDITATION kind)
      tags: [Financier]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: financier:services (40 per 10 minutes)
      description: >
        serviceKind FINANCING creates a financing service; serviceKind
        ACCREDITATION creates the institution's qualification program
        (accreditationValidMonths / accreditationFeeAmount apply). Created in
        DRAFT by default; optional nested attributes/coverage payloads are
        applied right after the create. category must belong to the kind's
        closed set (FINANCING - WORKING_CAPITAL | INVOICE_FINANCING |
        PO_FINANCING | EQUIPMENT | VEHICLE | HOME | EDUCATION | AGRICULTURE |
        MICROENTERPRISE | SME | OTHER; ACCREDITATION - SUPPLIER_QUALIFICATION |
        VENDOR_APPROVAL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceKind, category, name]
              properties:
                serviceKind:
                  type: string
                  enum: [FINANCING, ACCREDITATION]
                category:
                  type: string
                  minLength: 2
                  maxLength: 40
                name:
                  type: string
                  minLength: 3
                  maxLength: 160
                summary:
                  type: [string, 'null']
                  maxLength: 300
                description:
                  type: [string, 'null']
                  maxLength: 8000
                targetSegment:
                  type: [string, 'null']
                  enum: [BUSINESS, INDIVIDUAL, BOTH]
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, ARCHIVED]
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                amountMin:
                  type: [number, 'null']
                  minimum: 0
                amountMax:
                  type: [number, 'null']
                  minimum: 0
                rateType:
                  type: [string, 'null']
                  enum: [MURABAHA_ANNUAL, FIXED_ANNUAL, FLAT_FEE]
                rateMax:
                  type: [number, 'null']
                  minimum: 0
                  maximum: 100
                feeFlat:
                  type: [number, 'null']
                  minimum: 0
                tenorMinMonths:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 120
                tenorMaxMonths:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 120
                repaymentFrequency:
                  type: [string, 'null']
                  enum: [MONTHLY, QUARTERLY, LUMP_SUM]
                gracePeriodDays:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 365
                shariaCompliant:
                  type: boolean
                processingDays:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 90
                accreditationValidMonths:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 60
                  description: ACCREDITATION kind only - lifetime of the grant once ACCREDITED
                accreditationFeeAmount:
                  type: [number, 'null']
                  minimum: 0
                  description: ACCREDITATION kind only - fee, invoiced externally (D-002)
                attributes:
                  type: object
                  description: optional initial text bullets applied after the create
                  properties:
                    kind:
                      type: string
                      enum: [FEATURE, ELIGIBILITY_CONDITION]
                    texts:
                      type: array
                      maxItems: 30
                      items:
                        type: string
                        maxLength: 300
                coverage:
                  type: array
                  maxItems: 60
                  description: coverage region names (free strings, DP-16)
                  items:
                    type: string
                    maxLength: 120
      responses:
        '201':
          description: Created service
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    $ref: '#/components/schemas/FinancierService'
        '400':
          description: Invalid service payload (zod) or category outside the kind's closed set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to create the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financier/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Own service detail incl. the composed requirements
      tags: [Financier]
      security:
        - cookieAuth: []
      description: >
        The composer's view of one service: terms + the full composed
        ServiceRequirement checklist (with nested ConditionTemplate data)
        the applicant will face.
      responses:
        '200':
          description: Service with composed requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    $ref: '#/components/schemas/FinancierService'
                  requirements:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ServiceRequirement'
                        - type: object
                          properties:
                            template:
                              $ref: '#/components/schemas/ConditionTemplate'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required for this service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
