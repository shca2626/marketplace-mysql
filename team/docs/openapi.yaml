  /api/media/{key}:
    get:
      summary: Serve a stored image rendition (immutable, cache-forever)
      tags: [Media]
      security: []
      description: >
        Key is the slash-separated rendition path (content-derived, immutable). Only image
        extensions the pipeline produces are served. Public-read with a generous per-IP
        rate limit. Responds 304 to If-None-Match; strong ETag; X-Content-Type-Options nosniff.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Multi-segment storage key, e.g. ab/cd/abcdef_original.webp
      responses:
        '200':
          description: Image bytes (webp, jpg, jpeg, png or gif)
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, max-age=31536000, immutable'
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (If-None-Match matched the ETag)
        '404':
          description: Not found (unsupported extension or missing key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: mediaRead rate limit (600 per minute per IP)
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
