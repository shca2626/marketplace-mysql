      tags: [Admin Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: admin:gate-action (60 per minute)
      description: >
        An admin formally opens a SUBMITTED request for platform review
        (SUBMITTED → UNDER_PLATFORM_REVIEW, reviewer stamped). Works for
        financing AND accreditation requests (auto-detected). Return stays
        gated on the state machine afterwards.
      responses:
        '200':
          description: Request now under platform review
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestType:
                    type: string
                    enum: [FINANCING, ACCREDITATION]
                  request:
                    oneOf:
                      - $ref: '#/components/schemas/FinancingRequest'
                      - $ref: '#/components/schemas/AccreditationRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request is not SUBMITTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to start the review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/financing/requests/{id}/return:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Return the request to the applicant (aggregate reason)
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: admin:gate-action (60 per minute)
      description: >
        Moves the request to RETURNED_FOR_COMPLETION with an aggregate
        returnedReason (per-item reasons live on the
        RequirementSubmission decisionNote rows). Works for financing AND
        accreditation requests (auto-detected). The applicant resubmits via
        POST /api/financing/requests/{id}/resubmit (or the accreditation
        twin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Returned request
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestType:
                    type: string
                    enum: [FINANCING, ACCREDITATION]
                  request:
                    oneOf:
                      - $ref: '#/components/schemas/FinancingRequest'
                      - $ref: '#/components/schemas/AccreditationRequest'
        '400':
          description: A return reason is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required / CSRF rejected
          content:
            application/json:
              schema:
