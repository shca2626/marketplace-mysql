  # Group 3 — Accreditation (applicant companies)
  /api/accreditation/requests:
    get:
      summary: My org's accreditation requests + the live subset
      tags: [Accreditation]
      security:
        - cookieAuth: []
      description: >
        Own-organization AccreditationRequest list (org members; accreditation
        qualifies ORGANIZATIONS - individuals use financing) plus the live
        subset (ACCREDITED + validUntil in the future). Number
        ACC-YYYY-###### (Sequence ACC). Runs the lazy expiry sweep.
      responses:
        '200':
          description: Accreditation request list + live subset
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccreditationRequest'
                  live:
                    type: array
                    description: ACCREDITED and not yet expired
                    items:
                      $ref: '#/components/schemas/AccreditationRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load your accreditations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create an accreditation request (ACCREDITATION-kind service)
      tags: [Accreditation]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: accreditation:create (20 per 10 minutes)
      description: >
        The qualification & accreditation MAIN flow (DP-26): a company picks
        the financier's ACCREDITATION-kind service and drafts a request
        (submit:true submits immediately - checklist generation, consent,
        expiry; see POST /api/accreditation/requests/{id}/submit). One record
        per (serviceId, organizationId); a renewal after a terminal state
        (ACCREDITED/REJECTED/EXPIRED/REVOKED/CANCELLED) supersedes the old
        row (history survives in AuditLog).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, organizationId]
              properties:
                serviceId:
                  type: string
                  description: the financier's ACCREDITATION-kind service (serviceKind enforced)
                organizationId:
                  type: string
                  description: the applicant company (submitting user must be a member)
                scopeNotes:
                  type: [string, 'null']
                  maxLength: 500
                  description: what the accreditation covers
                submit:
                  type: boolean
                  description: when true, submits into the gate immediately
                consent:
                  type: boolean
                  description: data-transfer consent; stamps consentAt at submit
      responses:
        '201':
          description: Created (and optionally submitted) accreditation request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/AccreditationRequest'
                  submitted:
                    $ref: '#/components/schemas/AccreditationRequest'
                    description: only when submit:true - the submitted request detail
        '400':
          description: Invalid accreditation payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: You are not a member of that organization / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Service (or organization) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Not an ACCREDITATION-kind service, program not accepting
            applications, or a non-terminal request already exists for this
            (service, org) pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to create the accreditation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accreditation/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Accreditation request detail (checklist + decision fields)
      tags: [Accreditation]
      security:
        - cookieAuth: []
      description: >
        Org-member (or admin) detail incl. the gate checklist verdicts and,
        post-decision, the grant/reject fields (decisionNote, accreditedAt,
        validUntil, revocationReason).
      responses:
        '200':
          description: Accreditation request detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    allOf:
                      - $ref: '#/components/schemas/AccreditationRequest'
                      - type: object
                        properties:
                          submissions:
                            type: array
                            items:
                              $ref: '#/components/schemas/RequirementSubmission'
                          gate:
                            type: object
                            properties:
                              totalRequired:
                                type: integer
                              verified:
                                type: integer
                              waived:
                                type: integer
                              canForward:
                                type: boolean
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied (not an org member of the applicant company)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accreditation request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the accreditation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accreditation/requests/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Submit the accreditation request into the gate (DRAFT → SUBMITTED)
      tags: [Accreditation]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: accreditation:submit (30 per 10 minutes)
      description: >
        DRAFT → SUBMITTED: generates the program checklist (PROFILE_FIELD
        auto-evals + answers), stamps consentAt, sets expiresAt
        (financingGeneral.requestExpiryDays, default 30) and enters the
        platform gate queue (R-4 - the financier sees it only after forward).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                consent:
                  type: boolean
                answers:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    properties:
                      requirementId:
                        type: string
                      conditionTemplateId:
                        type: string
                      valueText:
                        type: [string, 'null']
                        maxLength: 500
                      valueNumber:
                        type: [number, 'null']
                      valueDate:
                        type: [string, 'null']
                      accountDocumentId:
                        type: [string, 'null']
                      confirmed:
                        type: boolean
      responses:
        '200':
          description: Submitted accreditation request detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/AccreditationRequest'
        '400':
          description: Consent required / invalid answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Accreditation applications disabled by the platform / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accreditation request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot submit a request that is not DRAFT / program not accepting applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to submit the accreditation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accreditation/requests/{id}/resubmit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Resubmit after return (RETURNED_FOR_COMPLETION → UNDER_PLATFORM_REVIEW)
      tags: [Accreditation]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: accreditation:resubmit (30 per 10 minutes)
      description: >
        Re-supplies the flagged items (REJECTED → SUBMITTED; previously
        VERIFIED/WAIVED items preserved) and moves the request back to
        UNDER_PLATFORM_REVIEW.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    properties:
                      requirementId:
                        type: string
                      conditionTemplateId:
                        type: string
                      valueText:
                        type: [string, 'null']
                        maxLength: 500
                      valueNumber:
                        type: [number, 'null']
                      valueDate:
                        type: [string, 'null']
                      accountDocumentId:
                        type: [string, 'null']
                      confirmed:
                        type: boolean
      responses:
        '200':
          description: Resubmitted accreditation request detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/AccreditationRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accreditation request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot resubmit a request that is not RETURNED_FOR_COMPLETION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to resubmit the accreditation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accreditation/requests/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Cancel the accreditation request (pre-forward states only)
      tags: [Accreditation]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: accreditation:cancel (30 per 10 minutes)
      description: >
        Applicant org cancels. Pre-forward states only (DRAFT, SUBMITTED,
        UNDER_PLATFORM_REVIEW, RETURNED_FOR_COMPLETION).
      responses:
        '200':
          description: Cancelled accreditation request
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/AccreditationRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Accreditation request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot cancel a request that is already with the financier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to cancel the accreditation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accreditation/valid:
    get:
      summary: Live accreditations of the caller's orgs (RFQ-unlock check)
      tags: [Accreditation]
      security:
        - cookieAuth: []
      description: >
        Only ACCREDITED requests with validUntil in the future, across every
        org the caller belongs to (FINANCIER_SCHEMA v5.0 section 5.2). A
        live grant (a) unlocks RFQ send/receive participation with that
        financier and (b) auto-passes autoPassAccredited requirements on
        their other services (DP-26).
      responses:
        '200':
          description: Live accreditations
          content:
            application/json:
              schema:
                type: object
                properties:
                  live:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccreditationRequest'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load live accreditations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Group 4 — Documents center (ALL users — universal, DP-27)
  /api/documents:
    get:
      summary: My document vault (personal or one org scope)
      tags: [Documents]
      security:
        - cookieAuth: []
      description: >
        Universal documents center (DP-27): AccountDocument rows owned by
        the caller (personal) or, with organizationId, one org the caller is
        a member of (org-scope docs). MediaAsset-backed (media object);
        verified ONCE by the platform, reused by every request type (R-2).
      parameters:
        - name: organizationId
          in: query
          schema:
            type: string
          description: restrict to one org scope the caller belongs to
        - name: documentType
          in: query
          schema:
            type: string
            enum: [NATIONAL_ID, PASSPORT, RESIDENCE_PERMIT, COMMERCIAL_REG, TAX_CARD, BUSINESS_LICENSE, BANK_STATEMENT, FINANCIAL_STATEMENT, PROOF_OF_ADDRESS, GUARANTEE_DOC, FEASIBILITY_STUDY, INVOICE, PURCHASE_ORDER, PROJECT_FILE, OTHER]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, VERIFIED, REJECTED]
        - name: includeInactive
          in: query
          schema:
            type: boolean
          description: include soft-deleted rows (default false)
      responses:
        '200':
          description: Vault documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountDocument'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of that organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load your documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Upload into the vault (single file, MediaAsset-backed)
      tags: [Documents]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: documents:upload (30 per 10 minutes)
      description: >
        Universal vault upload for ALL users. Multipart single file; goes
        through the REAL media pipeline (magic-sniff, size caps, webp
        renditions, sha256-dedupe) exactly like the uploads route. Allowed
        document types + maxSizeMb come from the financingDocuments settings
        panel; expiresAt must be in the future.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, documentType]
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  type: string
                  enum: [NATIONAL_ID, PASSPORT, RESIDENCE_PERMIT, COMMERCIAL_REG, TAX_CARD, BUSINESS_LICENSE, BANK_STATEMENT, FINANCIAL_STATEMENT, PROOF_OF_ADDRESS, GUARANTEE_DOC, FEASIBILITY_STUDY, INVOICE, PURCHASE_ORDER, PROJECT_FILE, OTHER]
                title:
                  type: [string, 'null']
                  maxLength: 160
                issuedAt:
                  type: [string, 'null']
                  description: document's own issue date
                expiresAt:
                  type: [string, 'null']
                  description: freshness vs ConditionTemplate.validityMonths
                organizationId:
                  type: [string, 'null']
                  description: org-scope doc (company registry papers); absent = personal
      responses:
        '201':
          description: Uploaded document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/AccountDocument'
        '400':
          description: No file / missing document type / type not allowed / already-expired expiresAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not a member of that organization / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File exceeds the maxSizeMb (or hard) upload limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Upload failed while processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Edit document metadata (title/issuedAt/expiresAt)
      tags: [Documents]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: documents:update (60 per 10 minutes)
      description: >
        Owner-only metadata update. Replacing a document = soft-delete the
        old row + upload the new version (R-2 single entry); historical
        RequirementSubmission links keep pointing at the old row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: [string, 'null']
                  maxLength: 200
                issuedAt:
                  type: [string, 'null']
                expiresAt:
                  type: [string, 'null']
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/AccountDocument'
        '400':
          description: Invalid document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the uploader can edit / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to update the document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Soft-delete a vault document (evidence rows preserved)
      tags: [Documents]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
