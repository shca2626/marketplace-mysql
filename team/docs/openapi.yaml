  /api/orders:
    get:
      summary: My purchase history (newest first)
      tags: [Orders]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Orders with items and payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Checkout - create an order (optionally org-approval routed)
      tags: [Orders]
      security:
        - cookieAuth: []
      description: >
        Server-authoritative pricing and stock validation. CARD settles inline (simulated gateway);
        BANK_TRANSFER parks the order in PENDING_PAYMENT; org members at/over the approval
        threshold route to PENDING_APPROVAL instead of settling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, fullName, address, city, country, zip]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 99
                      variantId:
                        type: [string, 'null']
                fullName:
                  type: string
                  maxLength: 80
                address:
                  type: string
                  maxLength: 200
                city:
                  type: string
                  maxLength: 80
                country:
                  type: string
                  maxLength: 80
                zip:
                  type: string
                  maxLength: 20
                phone:
                  type: [string, 'null']
                  maxLength: 30
                couponCode:
                  type: [string, 'null']
                  maxLength: 24
                paymentMethod:
                  type: string
                  enum: [CARD, BANK_TRANSFER]
                  description: Absent defaults to CARD (legacy callers)
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  pendingApproval:
                    type: boolean
                  pendingPayment:
                    type: boolean
                  payment:
                    type: [object, 'null']
                    properties:
                      method:
                        type: string
                      status:
                        type: string
                      instructions:
                        type: [string, 'null']
                      dueAt:
                        type: [string, 'null']
                  pricing:
                    type: object
                    properties:
                      subtotal:
                        type: number
                      discount:
                        type: number
                      shipping:
                        type: number
                      total:
                        type: number
                      couponCode:
                        type: [string, 'null']
        '400':
          description: >
            Validation error, empty cart, unavailable product/variant, insufficient stock,
            suspended vendor, or invalid coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in to place an order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Checkout failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Single order (buyer, participating seller, or admin)
      tags: [Orders]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Order detail (seller view flags items.mine)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not a party to the order)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Seller advances fulfillment, OR buyer cancels (action=cancel)
      tags: [Orders]
      security:
        - cookieAuth: []
      description: >
        Two discriminated bodies: {"action":"cancel"} (buyer; allowed from PAID, PENDING_APPROVAL
        and PENDING_PAYMENT; restocks items and voids payment/approval) or
        {"status":"PROCESSING"|"SHIPPED"|"DELIVERED"} (seller/admin; strictly one step forward in
        PAID -> PROCESSING -> SHIPPED -> DELIVERED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [cancel]
                - type: object
                  required: [status]
                  properties:
                    status:
                      type: string
                      enum: [PROCESSING, SHIPPED, DELIVERED]
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status, illegal transition, or cancellation no longer possible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the buyer can cancel / only the seller can update fulfillment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
