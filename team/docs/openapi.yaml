  # Group 6 — Admin: THE GATE + governance
  /api/admin/financing/gate:
    get:
      summary: THE GATE review queue (financing + accreditation)
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      description: >
        THE GATE (DP-23): financing + accreditation requests in SUBMITTED /
        UNDER_PLATFORM_REVIEW / RETURNED_FOR_COMPLETION, with status tabs,
        search (number / applicant / org) and pagination. Runs the lazy
        expiry sweep. type=FINANCING or ACCREDITATION restricts to one
        queue (the other comes back empty).
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [ALL, FINANCING, ACCREDITATION]
            default: ALL
          description: request type filter (both queues by default)
        - name: status
          in: query
          schema:
            type: string
            enum: [SUBMITTED, UNDER_PLATFORM_REVIEW, RETURNED_FOR_COMPLETION]
        - name: q
          in: query
          schema:
            type: string
          description: free-text search on number / applicant / organization (alias - search)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Both gate queues (each paginated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  financing:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          $ref: '#/components/schemas/FinancingRequest'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                  accreditation:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccreditationRequest'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the gate queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/financing/gate/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Full gate dossier for either request type (auto-detected)
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      description: >
        The gate console's dossier: the request (either type - cuid ids are
        globally unique, auto-detected) with the full checklist (answers +
        platform verdicts + nested requirement/template labels) and the gate
        completeness meter. The admin console joins the applicant's vault
        documents via /api/admin/financing/documents?userId=.
      responses:
        '200':
          description: Gate dossier (requestType + detail)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestType:
                    type: string
                    enum: [FINANCING, ACCREDITATION]
                  request:
                    oneOf:
                      - allOf:
                          - $ref: '#/components/schemas/FinancingRequest'
                          - type: object
                            properties:
                              submissions:
                                type: array
                                items:
                                  $ref: '#/components/schemas/RequirementSubmission'
                              gate:
                                type: object
                                properties:
                                  totalRequired:
                                    type: integer
                                  verified:
                                    type: integer
                                  waived:
                                    type: integer
                                  canForward:
                                    type: boolean
                                  missing:
                                    type: array
                                    items:
