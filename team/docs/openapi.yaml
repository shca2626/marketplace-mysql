          headers:
            Retry-After:
              schema:
                type: string
        '500':
          description: Failed to remove the document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Group 5 — Financier inbox (gate-enforced: FORWARDED+ only)
  /api/financier/requests:
    get:
      summary: FORWARDED+ financing requests (gate-enforced inbox)
      tags: [Financier]
      security:
        - cookieAuth: []
      description: >
        Financier console inbox. THE PLATFORM GATE IS STRUCTURAL (R-4 /
        DP-23): the query returns only requests in FORWARDED_TO_FINANCIER and
        later states (or carrying a forwardedAt stamp) - a SUBMITTED or
        RETURNED request is platform-private by construction and can never
        be listed here. Paginated; runs the lazy expiry sweep.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [FORWARDED_TO_FINANCIER, UNDER_FINANCIER_REVIEW, OFFERED, ACCEPTED, DECLINED, EXPIRED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Forwarded financing requests page
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancingRequest'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/financier/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Forwarded request detail incl. checklist verdicts + offers
      tags: [Financier]
      security:
        - cookieAuth: []
      description: >
        Request detail for the financier: full wizard payload + the platform
        gate's per-requirement verdicts (RequirementSubmission rows with
        nested requirement/template labels + gate meter) + every offer incl.
        DRAFTs. Pre-forward requests 404 here (invisible - R-4).
      responses:
        '200':
          description: Forwarded request detail with checklist verdicts and offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    allOf:
                      - $ref: '#/components/schemas/FinancingRequest'
                      - type: object
                        properties:
                          submissions:
                            type: array
                            items:
                              $ref: '#/components/schemas/RequirementSubmission'
                          gate:
                            type: object
                            properties:
                              totalRequired:
                                type: integer
                              verified:
                                type: integer
                              waived:
                                type: integer
                              canForward:
                                type: boolean
                          offers:
                            type: array
                            description: every offer incl. drafts (financier view)
                            items:
                              $ref: '#/components/schemas/FinancingOffer'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Financier staff access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found / not forwarded to this financier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
