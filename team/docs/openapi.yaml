  /api/media/{key}:
    get:
      summary: Serve a stored image rendition (immutable, cache-forever)
      tags: [Media]
      security: []
      description: >
        Key is the slash-separated rendition path (content-derived, immutable). Only image
        extensions the pipeline produces are served. Public-read with a generous per-IP
        rate limit. Responds 304 to If-None-Match; strong ETag; X-Content-Type-Options nosniff.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Multi-segment storage key, e.g. ab/cd/abcdef_original.webp
      responses:
        '200':
          description: Image bytes (webp, jpg, jpeg, png or gif)
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, max-age=31536000, immutable'
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (If-None-Match matched the ETag)
        '404':
          description: Not found (unsupported extension or missing key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: mediaRead rate limit (600 per minute per IP)
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/uploads:
    post:
      summary: Multipart image upload (magic-byte sniffed, webp renditions, sha256 dedup)
      tags: [Uploads]
      security:
        - cookieAuth: []
      x-csrf: assertSameOrigin
      x-rate-limit: upload (30 per 10 min per user)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files (max per-request bound by UPLOAD_LIMITS.maxFilesPerRequest; 8 MB each)
      responses:
        '201':
          description: Partial or full success; assets array may coexist with per-file errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaAsset'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        error:
                          type: string
        '400':
          description: Expected multipart/form-data, no file provided, or too many files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only sellers can upload media / suspended vendor / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: "Every file failed processing (body {assets: [], errors: [...]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items: {}
                  errors:
                    type: array
                    items:
                      type: object
        '429':
          description: upload rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
    get:
      summary: My media library (admin sees all), newest first
      tags: [Uploads]
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
