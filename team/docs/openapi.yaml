      summary: The GENERAL conditions library (searchable)
      tags: [Admin Financing]
      security:
        - cookieAuth: []
      description: >
        The platform's shared GENERAL ConditionTemplate library (R-5): one
        definition reused by many financiers on many services. Admin sees
        the full GENERAL scope.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: free-text search on title/code (alias - search)
        - name: conditionType
          in: query
          schema:
            type: string
            enum: [DOCUMENT, PROFILE_FIELD, DECLARATION, TEXT, NUMBER, DATE, SELECT, MULTI_SELECT]
        - name: includeInactive
          in: query
          schema:
            type: boolean
          description: include isActive=false templates (default false)
      responses:
        '200':
          description: GENERAL condition templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConditionTemplate'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
