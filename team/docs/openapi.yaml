openapi: 3.1.0
info:
  title: Vendora Platform API
  version: 1.1.0
  description: |
    Authentication is a custom HTTP-only cookie session: cookie name `vendora_session`, value
    `${userId}.${expMs}.${HMAC-SHA256}` (signed, expiring, stateless token resolved against the
    users table at request time). Guards: requireUser() rejects with 401 `{"error":"Please sign in first"}`,
    requireAdmin() with 403 `{"error":"Admin access required"}`. Roles: User.role BUYER | SELLER | ADMIN;
    organization membership roles OWNER | ADMIN | BUYER | APPROVER | VIEWER enforced per-service.
    Error model: every error body is `{"error": string}`; zod validation failures return 400 with the
    first issue message; service-layer errors carry their own HTTP status; the rate limiter returns
    429 with a `Retry-After` header.
    Pagination: list endpoints use `page`/`limit` (products: limit 1-48, default 24, envelope
    `{items,total,page,pages}`); the media library uses `limit` 1-60 / `offset` with envelope
    `{assets,errors,total,limit,offset}`. All other list endpoints return unpaginated arrays.
    This contract documents the single deployed SPA backend; there is no versioned API surface yet
    (see team/docs/03-api-contract.md, section 7). Paths under /api/financing*, /api/financier*,
    /api/accreditation* and /api/documents* are PLANNED (financier domain v5.0, marked
    `x-planned: true`) and are not implemented. Version 1.1.0 = planned financier surface
    rebuilt to FINANCIER_SCHEMA v5.0 (services-not-products, platform verification gate,
    requirements engine, universal documents, accreditation as a main service).
    Documented surface: 123 paths (88 existing + 35 planned) and 164 operations
    (121 existing + 43 planned).
servers:
  - url: /
    description: Relative to the Caddy gateway origin that fronts this Next.js app (single deployment)
externalDocs:
  description: API conventions, CSRF and rate-limit policies, coverage matrix
  url: https://github.com/vendora/team/docs/03-api-contract.md
tags:
  - name: Auth
    description: Cookie session login/register/logout and account upgrade
  - name: Catalog
    description: Public category attribute definitions powering dynamic forms and filters
  - name: Categories
    description: Public category listing with live product counts
  - name: Home
    description: Aggregated landing-page feed
  - name: Products
    description: Product CRUD, bulk ops, export (seller/admin)
  - name: Favorites
    description: Buyer wishlist toggle
  - name: Reviews
    description: Product reviews with verified-purchase badge
  - name: Orders
    description: Checkout, purchase history, fulfillment, cancellation, per-order payment
  - name: Payments
    description: Public checkout method catalog
  - name: Pricing
    description: B2B price resolution (contract / customer-group / retail)
  - name: Quotes
    description: Quote lifecycle on RFQs (accept, decline, withdraw, convert, PDF, admin review)
  - name: RFQs
    description: Requests-for-quote, negotiation messages, seller inbox, public display config
  - name: Approvals
    description: Organization purchase-approval queue and decisions
  - name: Disputes
    description: Buyer-seller dispute lifecycle
  - name: Recurring RFQs
    description: Scheduled RFQ generation, pause/resume/skip
  - name: Organizations
    description: Business accounts, members, approval policy
  - name: Sellers
    description: Public seller storefront profiles
  - name: Seller Console
    description: Vendor dashboards (stats, orders, earnings)
  - name: Notifications
    description: In-app bell feed and read state
  - name: Media
    description: Immutable rendition serving (public, cache-forever)
  - name: Uploads
    description: Image upload pipeline and media library (seller/admin)
  - name: Storefront Settings
    description: Public storefront configuration + active slides
  - name: 'Admin: Audit'
  - name: 'Admin: Coupons'
  - name: 'Admin: Customer Groups'
  - name: 'Admin: Disputes'
  - name: 'Admin: Orders'
  - name: 'Admin: Organizations'
  - name: 'Admin: Payments'
  - name: 'Admin: Payouts'
  - name: 'Admin: Price Lists'
  - name: 'Admin: Quotes'
  - name: 'Admin: RFQs'
  - name: 'Admin: RFQ Settings'
  - name: 'Admin: Settings'
  - name: 'Admin: Slides'
  - name: 'Admin: Stats'
  - name: 'Admin: Vendors'
  - name: Financing (planned)
    description: >
      Planned applicant-facing financing surface (FINANCIER_SCHEMA v5.0): public services
      directory, wizard-submitted requests, offer accept/decline. None of these endpoints
      exist in code yet; every path carries x-planned: true.
  - name: Financier Console (planned)
    description: >
      Planned financier console surface (FINANCIER_SCHEMA v5.0): services + requirements
      composer, private + GENERAL condition library, gate-enforced inbox (FORWARDED+ requests
      only), offers, accreditation decisions, agreement event reporting. Planned only
      (x-planned: true).
  - name: Accreditation (planned)
    description: >
      Planned applicant-company accreditation surface (FINANCIER_SCHEMA v5.0, DP-26):
      accreditation requests and live-grant lookup (RFQ-unlock check). Planned only
      (x-planned: true).
  - name: Documents (planned)
    description: >
      Planned universal documents center for ALL users and organizations (DP-27):
      AccountDocument vault over MediaAsset, verified once, reused by every request type.
      Planned only (x-planned: true).
  - name: Financing Admin (planned)
    description: >
      Planned admin gate + governance surface (FINANCIER_SCHEMA v5.0, DP-23): verification
      gate queue and actions (verify/reject/waive, return, forward), institutions, fees,
      GENERAL conditions library, AccountDocument verification. Planned only (x-planned: true).
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vendora_session
      description: >
        Custom session cookie set by POST /api/auth/login and POST /api/auth/register.
        Value `${userId}.${expMs}.${HMAC-SHA256}`; httpOnly, SameSite=Lax, Secure in production,
        path=/, server-side max age 30 days (MAX_AGE). Suspended accounts stop resolving.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    SessionUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [BUYER, SELLER, ADMIN]
        image:
          type: [string, 'null']
        storeName:
          type: [string, 'null']
        storeBio:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ProductSummary:
      type: object
      description: serializeProduct() DTO (fields below are the stable core; serializer adds commerce detail)
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        compareAtPrice:
          type: [number, 'null']
        images:
          type: array
          items:
            type: string
        categoryId:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
        sellerId:
          type: string
        stock:
          type: integer
        soldCount:
          type: integer
        rating:
          type: number
        reviewCount:
          type: integer
        featured:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DRAFT, ARCHIVED]
        favorited:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ProductList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total:
          type: integer
        page:
          type: integer
        pages:
          type: integer
    ProductForm:
      type: object
      description: Shared productFormSchema (POST /api/products and PUT /api/products/{id})
      required: [title, description, price, categoryId, stock]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 4000
        price:
          type: number
          exclusiveMinimum: 0
        compareAtPrice:
          type: [number, 'null']
          exclusiveMinimum: 0
        images:
          type: array
          maxItems: 6
          items:
            type: string
            maxLength: 2048
          description: http(s) URLs or uploaded /api/media keys; publish (status ACTIVE) requires >= 1
        categoryId:
          type: string
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        status:
          type: string
          enum: [ACTIVE, DRAFT]
        sku:
          type: [string, 'null']
          maxLength: 64
        barcode:
          type: [string, 'null']
          maxLength: 64
        videoUrl:
          type: [string, 'null']
          maxLength: 512
        highlights:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 160
        specs:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 60
              value:
                type: string
                maxLength: 200
        materials:
          type: [string, 'null']
          maxLength: 500
        care:
          type: [string, 'null']
          maxLength: 500
        weightGrams:
          type: [integer, 'null']
          minimum: 1
          maximum: 2000000
        lengthCm:
          type: [number, 'null']
        widthCm:
          type: [number, 'null']
        heightCm:
          type: [number, 'null']
        processingDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 30
        freeShipping:
          type: boolean
        shippingFee:
          type: [number, 'null']
          maximum: 10000
        shippingPolicy:
          type: [string, 'null']
          maxLength: 1000
        slug:
          type: [string, 'null']
          maxLength: 180
        metaTitle:
          type: [string, 'null']
          maxLength: 150
        metaDescription:
          type: [string, 'null']
          maxLength: 320
        moq:
          type: [integer, 'null']
          maximum: 1000000
        priceTiers:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              from:
                type: integer
              to:
                type: [integer, 'null']
              price:
                type: number
        variants:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProductVariantInput'
    ProductVariantInput:
      type: object
      required: [name, stock]
      properties:
        name:
          type: string
          maxLength: 200
        options:
          type: object
          additionalProperties:
            type: string
        price:
          type: [number, 'null']
        compareAtPrice:
          type: [number, 'null']
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        sku:
          type: [string, 'null']
        isActive:
          type: boolean
    Review:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        userId:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        sellerId:
          type: string
        title:
          type: string
        image:
          type: [string, 'null']
        price:
          type: number
        quantity:
          type: integer
        variantId:
          type: [string, 'null']
        variantName:
          type: [string, 'null']
        mine:
          description: Present on seller-scoped serializations; true when the item belongs to that seller
          type: boolean
    Order:
      type: object
      properties:
        id:
          type: string
        total:
          type: number
        status:
          type: string
          enum: [PENDING_APPROVAL, PENDING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
        fullName:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        zip:
          type: string
        phone:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        paymentTerms:
          type: [string, 'null']
        poNumber:
          type: [string, 'null']
        sourceType:
          type: [string, 'null']
        buyer:
          type: [object, 'null']
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        payment:
          type: [object, 'null']
          properties:
            method:
              type: string
            status:
              type: string
            reference:
              type: [string, 'null']
            instructions:
              type: [string, 'null']
            dueAt:
              type: [string, 'null']
              format: date-time
            paidAt:
              type: [string, 'null']
              format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    MediaAsset:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
          description: Storage base key; renditions are served under /api/media/{key}
        originalName:
          type: string
        mime:
          type: string
        size:
          type: integer
        width:
          type: integer
        height:
          type: integer
        sha256:
          type: string
        variants:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        linkView:
          type: [string, 'null']
        linkId:
          type: [string, 'null']
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    AuditLog:
      type: object
      properties:
        id:
          type: string
        actorId:
          type: [string, 'null']
        actorType:
          type: string
          enum: [USER, ADMIN, SYSTEM]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: [string, 'null']
        summary:
          type: string
        metadata:
          description: Json column; the financing domain deliberately avoids it (DP-15)
        createdAt:
          type: string
          format: date-time
    RfqLineInput:
      type: object
      required: [quantity]
      properties:
        productId:
          type: [string, 'null']
        productName:
          type: [string, 'null']
          maxLength: 200
        sku:
          type: [string, 'null']
          maxLength: 80
        variantId:
          type: [string, 'null']
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        targetPrice:
          type: [number, 'null']
        notes:
          type: [string, 'null']
          maxLength: 2000
      description: productId or productName must be present (refined in zod)
    Rfq:
      type: object
      description: Service-serialized RFQ (summary shape; number, status, lines, quote counts)
      properties:
        id:
          type: string
        number:
          type: string
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        status:
          type: string
          description: DRAFT | OPEN | REVIEW | ORDERED | CLOSED | REJECTED | CANCELLED (service lifecycle)
        organizationId:
          type: [string, 'null']
        userId:
          type: string
        lines:
          type: array
          items:
            type: object
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        createdAt:
          type: string
          format: date-time
    Quote:
      type: object
      description: Service-serialized quote (summary shape)
      properties:
        id:
          type: string
        number:
          type: string
        rfqId:
          type: string
        sellerId:
          type: [string, 'null']
          description: null = platform-facilitated quote issued by an admin
        status:
          type: string
          enum: [SENT, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN, CONVERTED]
        currency:
          type: string
        subtotal:
          type: number
        discountTotal:
          type: number
        shippingTotal:
          type: number
        taxTotal:
          type: number
        total:
          type: number
        paymentTerms:
          type: [string, 'null']
        validUntil:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
        lines:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
    FinancingRequestPlanned:
      type: object
      description: >
        PLANNED summary shape of FinancingRequest v3 (FINANCIER_SCHEMA v5.0 section 3.8).
        Not implemented; field names are authoritative for the future implementation.
        v5 changes - serviceId REQUIRED (services-not-products, DP-22), multiGroupId sibling
        routing (DP-25), and the PLATFORM VERIFICATION GATE fields (platformReviewedById,
        platformNote, returnedReason, forwardedAt - DP-23).
      properties:
        id:
          type: string
        number:
          type: string
          description: FR-YYYY-###### (Sequence FIN)
        organizationId:
          type: [string, 'null']
          description: applicant org (B2B); null = individual (DP-13)
        createdById:
          type: string
        serviceId:
          type: string
          description: the applied-for FinancierService (serviceKind FINANCING enforced)
        targetType:
          type: string
          enum: [WORKING_CAPITAL, QUOTE, ORDER, RFQ_LINE]
        targetId:
          type: [string, 'null']
          description: quote/order/rfqLine id (loose FK, Dispute pattern)
        multiGroupId:
          type: [string, 'null']
          description: DP-25 - sibling requests (one per financier's service) share the group id
        activityStatus:
          type: [string, 'null']
          enum: [NEW, EXISTING]
        activityName:
          type: [string, 'null']
        activityDescription:
          type: [string, 'null']
        activityStartDate:
          type: [string, 'null']
          format: date
          description: null = not started yet
        activityCity:
          type: [string, 'null']
          description: free string, matched against service coverage (DP-16)
        activityDistrict:
          type: [string, 'null']
        activityAddress:
          type: [string, 'null']
        activityLocationType:
          type: [string, 'null']
          enum: [OWNED, RENTED]
        activityCategory:
          type: [string, 'null']
          description: applicant's answer to "activity type"
        activityCategoryOther:
          type: [string, 'null']
          description: free text when activityCategory = OTHER
        capitalAmount:
          type: [number, 'null']
        ownContributionAmount:
          type: [number, 'null']
        monthlyInstallmentCapacity:
          type: [number, 'null']
        previousFinancing:
          type: [boolean, 'null']
        otherIncomeSources:
          type: [string, 'null']
        amountRequested:
          type: number
        currency:
          type: string
          description: ISO-4217; no currency table
        purpose:
          type: [string, 'null']
        tenorRequestedMonths:
          type: [integer, 'null']
        guaranteeType:
          type: [string, 'null']
          enum: [PERSONAL_GUARANTEE, BANK_GUARANTEE, GOLD, COMMERCIAL, MORTGAGE, CONVERTIBLE_SECURITIES, SELF_GUARANTEE, OTHER]
        guaranteeTypeOther:
          type: [string, 'null']
        guaranteeStatus:
          type: [string, 'null']
          enum: [AVAILABLE, PARTIALLY_AVAILABLE, UNAVAILABLE, OTHER]
        guaranteeStatusOther:
          type: [string, 'null']
        applicantNotes:
          type: [string, 'null']
        consentAt:
          type: [string, 'null']
          format: date-time
          description: data-transfer consent + terms, stamped at submit
        platformReviewedById:
          type: [string, 'null']
          description: the admin working the gate
        platformNote:
          type: [string, 'null']
          description: public-to-applicant review summary
        returnedReason:
          type: [string, 'null']
          description: aggregate reason when RETURNED_FOR_COMPLETION (per-item notes live on RequirementSubmission.decisionNote)
        forwardedAt:
          type: [string, 'null']
          format: date-time
          description: set when the gate PASSED - financier visibility starts HERE (R-4)
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_PLATFORM_REVIEW, RETURNED_FOR_COMPLETION, FORWARDED_TO_FINANCIER, UNDER_FINANCIER_REVIEW, OFFERED, ACCEPTED, DECLINED, EXPIRED, CANCELLED]
        submittedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    FinancingOfferPlanned:
      type: object
      description: >
        PLANNED summary shape of FinancingOffer (FINANCIER_SCHEMA v5.0 section 3.9;
        unchanged from v4.0 apart from the section renumber). Not implemented.
      properties:
        id:
          type: string
        requestId:
          type: string
        createdById:
          type: string
        amount:
          type: number
        currency:
          type: string
        rateType:
          type: [string, 'null']
          enum: [MURABAHA_ANNUAL, FIXED_ANNUAL, FLAT_FEE]
        ratePercent:
          type: [number, 'null']
        feeFlat:
          type: [number, 'null']
        tenorMonths:
          type: integer
        collateralRequired:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        validUntil:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [DRAFT, SENT, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        installments:
          type: array
          items:
            type: object
            properties:
              installmentNo:
                type: integer
              dueDate:
                type: string
                format: date
              amount:
                type: number
        createdAt:
          type: string
          format: date-time
    FinancierService:
      type: object
      description: >
        PLANNED shape of FinancierService (FINANCIER_SCHEMA v5.0 section 3.4) - THE
        offering, renamed from v4's FinancingProduct (DP-22, services-not-products).
        A service is either FINANCING or an ACCREDITATION program (serviceKind);
        every application targets exactly ONE service, which keeps the requirements
        checklist always well-defined. Not implemented.
      properties:
        id:
          type: string
        financierProfileId:
          type: string
        serviceKind:
          type: string
          enum: [FINANCING, ACCREDITATION]
        category:
          type: string
          description: >
            FINANCING - WORKING_CAPITAL | INVOICE_FINANCING | PO_FINANCING | EQUIPMENT |
            VEHICLE | HOME | EDUCATION | AGRICULTURE | MICROENTERPRISE | SME | OTHER;
            ACCREDITATION - SUPPLIER_QUALIFICATION | VENDOR_APPROVAL
        name:
          type: string
        summary:
          type: [string, 'null']
        description:
          type: [string, 'null']
        targetSegment:
          type: [string, 'null']
          enum: [BUSINESS, INDIVIDUAL, BOTH]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        currency:
          type: string
          description: ISO-4217; no currency table
        amountMin:
          type: [number, 'null']
        amountMax:
          type: [number, 'null']
          description: null = open (ACCREDITATION kinds)
        rateType:
          type: [string, 'null']
          enum: [MURABAHA_ANNUAL, FIXED_ANNUAL, FLAT_FEE]
        rateMax:
          type: [number, 'null']
          description: e.g. 30.000 = 30%/yr cap (murabaha)
        feeFlat:
          type: [number, 'null']
        tenorMinMonths:
          type: [integer, 'null']
        tenorMaxMonths:
          type: [integer, 'null']
        repaymentFrequency:
          type: [string, 'null']
          enum: [MONTHLY, QUARTERLY, LUMP_SUM]
        gracePeriodDays:
          type: [integer, 'null']
        shariaCompliant:
          type: boolean
        processingDays:
          type: [integer, 'null']
        accreditationValidMonths:
          type: [integer, 'null']
          description: ACCREDITATION kind - lifetime of the grant once ACCREDITED
        accreditationFeeAmount:
          type: [number, 'null']
          description: ACCREDITATION kind - fee invoiced externally (D-002)
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConditionTemplate:
      type: object
      description: >
        PLANNED shape of ConditionTemplate (FINANCIER_SCHEMA v5.0 section 3.5) - the
        requirements engine (DP-24). scope GENERAL = platform-curated shared library
        (admin-managed, reused by many financiers/services); scope FINANCIER = private
        to one financier org. Attached per-service via ServiceRequirement; options are
        ConditionOption rows, never JSON (R-1). Not implemented.
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [GENERAL, FINANCIER]
        organizationId:
          type: [string, 'null']
          description: null = GENERAL (platform library, admin-managed); set = FINANCIER-private
        conditionType:
          type: string
          enum: [DOCUMENT, PROFILE_FIELD, DECLARATION, TEXT, NUMBER, DATE, SELECT, MULTI_SELECT]
        code:
          type: [string, 'null']
          description: optional stable ref, e.g. COM-REG
        title:
          type: string
        description:
          type: [string, 'null']
          description: instructions shown to the applicant
        profileFieldKey:
          type: [string, 'null']
          description: >
            PROFILE_FIELD only - closed set - user.phone | user.identityNumber |
            user.dateOfBirth | org.taxId | org.registrationNumber | org.industry
        documentType:
          type: [string, 'null']
          description: DOCUMENT only - expected AccountDocument.documentType
        validationMin:
          type: [number, 'null']
          description: NUMBER only - inclusive lower bound
        validationMax:
          type: [number, 'null']
          description: NUMBER only - inclusive upper bound
        validityMonths:
          type: [integer, 'null']
          description: evidence freshness window (e.g. bank statement 3 months old)
        isRepeatable:
          type: boolean
          description: DOCUMENT only - multiple docs allowed (e.g. 6 monthly statements)
        isActive:
          type: boolean
        createdById:
          type: string
        options:
          type: array
          description: ConditionOption rows (SELECT / MULTI_SELECT choices - R-1, no JSON)
          items:
            type: object
            properties:
              id:
                type: string
              conditionTemplateId:
                type: string
              value:
                type: string
              position:
                type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceRequirement:
      type: object
      description: >
        PLANNED shape of ServiceRequirement (FINANCIER_SCHEMA v5.0 section 3.5) - ONE
        ConditionTemplate attached to ONE FinancierService with per-attachment config.
        One definition, many attachments (R-5). Not implemented.
      properties:
        id:
          type: string
        serviceId:
          type: string
        conditionTemplateId:
          type: string
        isRequired:
          type: boolean
          description: optional conditions inform but never gate
        displayOrder:
          type: integer
        instructions:
          type: [string, 'null']
          description: financier's per-service override text
        autoPassAccredited:
          type: boolean
          description: auto-VERIFIED when the applicant org holds a live accreditation from THIS financier (DP-26)
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RequirementSubmission:
      type: object
      description: >
        PLANNED shape of RequirementSubmission (FINANCIER_SCHEMA v5.0 section 3.6) - the
        per-request checklist row the PLATFORM GATE verifies item-by-item (R-4). Exactly
        one parent set (financingRequestId or accreditationRequestId, service-enforced).
        Typed value columns - zero JSON (R-1). Not implemented.
      properties:
        id:
          type: string
        serviceRequirementId:
          type: string
        financingRequestId:
          type: [string, 'null']
        accreditationRequestId:
          type: [string, 'null']
        status:
          type: string
          enum: [PENDING, SUBMITTED, VERIFIED, REJECTED, WAIVED]
          description: >
            PENDING - visible, nothing supplied yet; SUBMITTED - applicant supplied an
            answer/document (or PROFILE_FIELD auto-evaluated); VERIFIED - platform verdict;
            REJECTED - decisionNote REQUIRED; WAIVED - optional item waived, decisionNote
            REQUIRED
        valueText:
          type: [string, 'null']
          description: TEXT / DECLARATION / SELECT answers
        valueNumber:
          type: [number, 'null']
          description: NUMBER answers
        valueDate:
          type: [string, 'null']
          format: date
          description: DATE answers
        accountDocumentId:
          type: [string, 'null']
          description: DOCUMENT evidence - reuse of an AccountDocument (uploaded once - R-2)
        submittedAt:
          type: [string, 'null']
          format: date-time
        verifiedAt:
          type: [string, 'null']
          format: date-time
        verifiedById:
          type: [string, 'null']
          description: the platform admin (or null for system autoPass)
        decisionNote:
          type: [string, 'null']
          description: rejection / waiver reason - shown to applicant
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountDocument:
      type: object
      description: >
        PLANNED shape of AccountDocument (FINANCIER_SCHEMA v5.0 section 3.7) - the
        UNIVERSAL document vault for ALL users and organizations (DP-27). MediaAsset-backed
        (mediaId - DP-19, the only storage subsystem); verified ONCE by the platform,
        reused by every financing / accreditation / KYC flow (R-2). Not implemented.
      properties:
        id:
          type: string
        userId:
          type: string
          description: owner/uploader - ALWAYS set (all users, not just applicants)
        organizationId:
          type: [string, 'null']
          description: org-scope docs (company registry papers); null = personal
        mediaId:
          type: string
          description: THE storage entry - MediaAsset carries key/mime/size/sha256/renditions
        documentType:
          type: string
          enum: [NATIONAL_ID, PASSPORT, RESIDENCE_PERMIT, COMMERCIAL_REG, TAX_CARD, BUSINESS_LICENSE, BANK_STATEMENT, FINANCIAL_STATEMENT, PROOF_OF_ADDRESS, GUARANTEE_DOC, FEASIBILITY_STUDY, INVOICE, PURCHASE_ORDER, PROJECT_FILE, OTHER]
        title:
          type: [string, 'null']
        issuedAt:
          type: [string, 'null']
          format: date
          description: document's own issue date
        expiresAt:
          type: [string, 'null']
          format: date
          description: freshness vs ConditionTemplate.validityMonths
        status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        reviewedById:
          type: [string, 'null']
        reviewedAt:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']
          description: verification / rejection note
        isActive:
          type: boolean
          description: soft-delete (replaced by a newer version of the doc)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccreditationRequest:
      type: object
      description: >
        PLANNED shape of AccreditationRequest (FINANCIER_SCHEMA v5.0 section 3.13) - the
        QUALIFICATION & ACCREDITATION main flow (DP-26): companies only, gate-first
        lifecycle, and the grant lives ON the request (status ACCREDITED + validUntil +
        revocation) - no separate grant entity. Number ACC-YYYY-###### (Sequence ACC);
        one record per (serviceId, organizationId). Not implemented.
      properties:
        id:
          type: string
        number:
          type: string
          description: ACC-YYYY-###### (Sequence ACC)
        organizationId:
          type: string
          description: the applicant company (accreditation qualifies ORGANIZATIONS)
        submittedById:
          type: string
        serviceId:
          type: string
          description: the financier's ACCREDITATION-kind service (serviceKind enforced)
        multiGroupId:
          type: [string, 'null']
          description: DP-25 - sibling accreditation requests share the group id
        scopeNotes:
          type: [string, 'null']
          description: what the accreditation covers
        consentAt:
          type: [string, 'null']
          format: date-time
        platformReviewedById:
          type: [string, 'null']
        platformNote:
          type: [string, 'null']
        returnedReason:
          type: [string, 'null']
          description: aggregate reason when RETURNED_FOR_COMPLETION
        forwardedAt:
          type: [string, 'null']
          format: date-time
          description: set when the platform gate PASSED - financier visibility starts here
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_PLATFORM_REVIEW, RETURNED_FOR_COMPLETION, FORWARDED_TO_FINANCIER, UNDER_FINANCIER_REVIEW, ACCREDITED, REJECTED, EXPIRED, REVOKED, CANCELLED]
        submittedAt:
          type: [string, 'null']
          format: date-time
        decidedById:
          type: [string, 'null']
          description: the financier's deciding staff user
        decidedAt:
          type: [string, 'null']
          format: date-time
        decisionNote:
          type: [string, 'null']
          description: financier's grant/reject note
        accreditedAt:
          type: [string, 'null']
          format: date-time
          description: grant stamp (ACCREDITED only)
        validUntil:
          type: [string, 'null']
          format: date
          description: grant lifetime - service.accreditationValidMonths default; ACCREDITED + validUntil in the future = live grant
        revokedById:
          type: [string, 'null']
        revokedAt:
          type: [string, 'null']
          format: date-time
        revocationReason:
          type: [string, 'null']
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: REQUEST-level expiry (pre-decision), lazy sweep
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RateLimited:
      type: object
      properties:
        error:
          type: string
          enum: ['Too many requests - slow down and try again shortly']
      description: 429 body; accompanied by a Retry-After header (seconds)
    CsrfRejected:
      type: object
      properties:
        error:
          type: string
          enum: ['Cross-site requests are not allowed']
      description: 403 body from assertSameOrigin; accompanied by X-Reason header
paths:
  /api:
    get:
      summary: API root liveness ping
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Static hello response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/auth/login:
    post:
      summary: Sign in with email + password; sets the vendora_session cookie
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Signed in; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '400':
          description: Invalid input (zod first issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account SUSPENDED by platform administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Login failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      summary: Clear the session cookie
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
  /api/auth/me:
    get:
      summary: Current session user (null when signed out)
      tags: [Auth]
      security: []
      responses:
        '200':
          description: "Session state; body is {\"user\": null} when unauthenticated (never 401)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/SessionUser'
                      - type: 'null'
  /api/auth/register:
    post:
      summary: Register a BUYER or SELLER account; sets the session cookie
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 60
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  maxLength: 100
                role:
                  type: string
                  enum: [BUYER, SELLER]
                  default: BUYER
                storeName:
                  type: [string, 'null']
                  maxLength: 60
      responses:
        '201':
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '400':
          description: Invalid input (zod first issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/become-seller:
    post:
      summary: Upgrade a BUYER account to SELLER (admins rejected)
      tags: [Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeName]
              properties:
                storeName:
                  type: string
                  minLength: 2
                  maxLength: 60
                storeBio:
                  type: [string, 'null']
                  maxLength: 300
      responses:
        '200':
          description: Upgraded (or already a seller - idempotent return)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '400':
          description: Invalid input (zod first issue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin accounts already have full marketplace access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to upgrade account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/catalog:
    get:
      summary: Category attribute definitions for dynamic seller forms and filters
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Static catalog definitions (CATEGORY_CATALOG, CONDITIONS, PRODUCT_CONDITIONS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                  conditions:
                    type: array
                    items:
                      type: object
                  conditionValues:
                    type: array
                    items:
                      type: string
        '500':
          description: Failed to load catalog definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories:
    get:
      summary: All categories with ACTIVE product counts and a cover image
      tags: [Categories]
      security: []
      responses:
        '200':
          description: Category list ordered by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        icon:
                          type: [string, 'null']
                        productCount:
                          type: integer
                        coverImage:
                          type: [string, 'null']
        '500':
          description: Failed to load categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/home:
    get:
      summary: Aggregated landing-page feed (featured, trending, new arrivals, stats)
      tags: [Home]
      security: []
      description: Public; favorites flags personalize when a session cookie is present
      responses:
        '200':
          description: Landing feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  featured:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/ProductSummary'
                  trending:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/ProductSummary'
                  newArrivals:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/ProductSummary'
                  categories:
                    type: array
                    items:
                      type: object
                  stats:
                    type: object
                    properties:
                      productCount:
                        type: integer
                      sellerCount:
                        type: integer
                      reviewCount:
                        type: integer
                      orderCount:
                        type: integer
        '500':
          description: Failed to load home feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/settings:
    get:
      summary: Public storefront configuration + ACTIVE banner slides
      tags: [Storefront Settings]
      security: []
      description: Server-side cached ~5 min, cache busted on admin settings writes
      responses:
        '200':
          description: Effective settings (defaults when nothing stored) and active slides
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                  slides:
                    type: array
                    items:
                      type: object
        '500':
          description: Failed to load settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/rfq-config:
    get:
      summary: Public display flags honored by RFQ surfaces (MOQ, tiers, stock, ratings, expiry, disputes, recurring)
      tags: [RFQs]
      security: []
      responses:
        '200':
          description: Flattened RFQ display configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  moq:
                    type: object
                  tiers:
                    type: object
                  stock:
                    type: object
                  rating:
                    type: object
                  expiry:
                    type: object
                  disputes:
                    type: object
                  recurring:
                    type: object
        '500':
          description: Failed to load RFQ configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sellers/{id}:
    get:
      summary: Public storefront profile for an ACTIVE seller
      tags: [Sellers]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Store profile with aggregated stats and category chips
          content:
            application/json:
              schema:
                type: object
                properties:
                  seller:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      storeName:
                        type: [string, 'null']
                      storeBio:
                        type: [string, 'null']
                      memberSince:
                        type: string
                        format: date-time
                      activeListings:
                        type: integer
                      totalSold:
                        type: integer
                      avgRating:
                        type: number
                      reviewCount:
                        type: integer
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        count:
                          type: integer
        '404':
          description: Store not found (missing, not a seller, or suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/payments/methods:
    get:
      summary: Payment options offered at checkout
      tags: [Payments]
      security: []
      description: CARD runs on the simulated gateway (disabled with PAYMENT_DRIVER=manual); BANK_TRANSFER is operator-settled
      responses:
        '200':
          description: Checkout methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      type: object
  /api/products:
    get:
      summary: Product list with SQL-side filtering, search, sort and pagination
      tags: [Products]
      security: []
      description: >
        Public feed shows only ACTIVE products of ACTIVE sellers. mine=1 requires a session
        (seller's own rows, any status); scope=all is admin-only (full catalog + status filter).
        Search terms (max 8) are ANDed across title, description, category, store and owner name.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search; whitespace-separated terms ANDed
        - name: category
          in: query
          schema:
            type: string
          description: Category slug
        - name: min
          in: query
          schema:
            type: number
          description: Minimum price
        - name: max
          in: query
          schema:
            type: number
          description: Maximum price
        - name: sort
          in: query
          schema:
            type: string
            enum: [popular, newest, price-asc, price-desc, rating]
            default: popular
        - name: featured
          in: query
          schema:
            type: string
            enum: ['1']
          description: Only featured products
        - name: sellerId
          in: query
          schema:
            type: string
          description: Restrict to one store
        - name: mine
          in: query
          schema:
            type: string
            enum: ['1']
          description: My listings (requires session)
        - name: scope
          in: query
          schema:
            type: string
            enum: [all]
          description: Admin full-catalog browse
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DRAFT, ARCHIVED]
          description: Status filter (only meaningful with scope=all)
        - name: ids
          in: query
          schema:
            type: string
          description: Comma-separated ids (max 20); keeps caller order, paginates in memory
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 24
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '401':
          description: Unauthorized (mine=1 without session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required (scope=all as non-admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to load products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a product (seller or admin; suspended sellers rejected)
      tags: [Products]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductForm'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: '#/components/schemas/ProductSummary'
        '400':
          description: Invalid input / Category not found / service validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Please sign in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only sellers can create products, or vendor account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to create product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Product detail with reviews, seller card and related items
      tags: [Products]
      security: []
      description: Products of suspended sellers 404 for the public; owner and admin still see them
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: '#/components/schemas/ProductSummary'
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  seller:
                    type: [object, 'null']
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      storeName:
                        type: [string, 'null']
                      storeBio:
                        type: [string, 'null']
                      memberSince:
                        type: string
                        format: date-time
